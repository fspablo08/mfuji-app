<title>Sistema Monte Fuji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Sulphur+Point:wght@300;400;700&display=swap">
<style>
/*CSS*/
</style>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" type="button" aria-label="Abrir menu"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
      <img class="tlogo" id="tlogo" alt="Monte Fuji">
    </header>
    <section class="view" id="v-dash" aria-label="Dashboard"></section>
    <section class="view" id="v-agenda" aria-label="Agenda"></section>
    <section class="view" id="v-assist" aria-label="Assistente"></section>
    <section class="view" id="v-notas" aria-label="Anotações"></section>
    <section class="view" id="v-cli" aria-label="Clientes"></section>
    <section class="view" id="v-mail" aria-label="E-mails"></section>
    <section class="view" id="v-rec" aria-label="A receber"></section>
    <section class="view" id="v-func" aria-label="Funcionários"></section>
    <section class="view" id="v-cfg" aria-label="Configurações"></section>
    <p class="sub" id="syncSt" style="text-align:center;padding-top:6px">Monte Fuji · banco compartilhado</p>
  </div>
</div>
<button class="fab" id="fab" type="button"><span class="orb" aria-hidden="true"></span>Assistente</button>
<div class="dscrim" id="dscrim"></div>
<aside class="drawer" id="drawer" aria-label="Assistente Monte Fuji">
  <div class="dh"><span class="orb" aria-hidden="true"></span><span><b>Assistente Monte Fuji</b><small>Sugestões para a tela atual</small></span><button class="dots x" id="aiX" type="button" aria-label="Fechar">✕</button></div>
  <div class="ctx" id="aiCtx"></div>
  <div class="msgs" id="aiMsgs"></div>
  <div class="sugs" id="aiSugs"></div>
  <div class="composer"><textarea id="aiIn" rows="2" placeholder="Pergunte qualquer coisa…" aria-label="Mensagem para o assistente"></textarea><div class="b"><span class="tg">Monte Fuji</span><span class="sp"></span><button class="cta" type="button" id="aiSend">↑ Enviar</button></div></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
