<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Monte Fuji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Sulphur+Point:wght@300;400;700&display=swap">
<style>
/* Layout: app de tela cheia no modelo 03 (Fynix) — menu lateral sobre cinza, cartões brancos de 16px, um cartão vibrante em HIDRA por tela.
   Aparência única e clara por escolha: as cores da marca precisam aparecer exatas. */
:root{
  --fluxo:#253C8D; --fluxo-900:#18275E; --fluxo-50:#E6E8F2; --fluxo-100:#CAD0E3;
  --hidra:#3872CF; --hidra-400:#5A8AD7; --hidra-300:#7CA2DF; --hidra-100:#C0D3F0; --hidra-50:#E3EBF8;
  --luz:#F7F6F1; --trigo:#E7E4C7; --legado:#B49B54; --legado-700:#817249; --legado-50:#F4F1E7; --carvao:#2C2C2C;
  --branco:#FFFFFF; --fundo:#EFEFEC; --linha:#E6E6E3; --linha2:#EDEDEA; --campo:#F4F4F2;
  --t1:#2C2C2C; --t2:#4A4A49; --t3:#868684;
  --ok:#2F8F5B; --ok-50:#E5F2EA; --alerta:#D9A21B; --alerta-50:#FBF1D9; --alerta-700:#8A6510; --erro:#C2413A; --erro-50:#F8E6E5;
  --f-d:"Lexend Deca","Lexend",ui-sans-serif,system-ui,sans-serif;
  --f-t:"Sulphur Point",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--fundo)}
body{color:var(--t1);font-family:var(--f-d);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hidra);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== casca ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 16px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:9px;padding:2px 6px 14px}
.logo .mk{width:30px;height:30px;border-radius:50%;background:var(--fluxo);display:grid;place-items:center;flex:none}
.logo b{font-size:15px;font-weight:600}
.logo b span{color:var(--hidra)}
.acc{display:flex;align-items:center;gap:10px;background:var(--branco);border:1px solid #E3E3E0;border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;margin-bottom:4px}
.acc>span:nth-child(2){flex:1;min-width:0}
.acc b{display:block;font-size:12px;font-weight:500;white-space:nowrap}
.acc small{font-size:10.5px;color:var(--t3);white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--fluxo);color:var(--luz);font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.grp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:12px 8px 3px}
.menu{display:grid;gap:1px}
.menu a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;font-size:12.5px;color:var(--t2);text-decoration:none}
.menu a:hover{background:rgba(255,255,255,.65)}
.menu a.on{background:var(--branco);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.menu a.on svg{color:var(--hidra)}
.menu svg{width:15px;height:15px;flex:none}
.menu .bd{margin-left:auto;font-size:10px;font-weight:600;background:var(--hidra-50);color:var(--fluxo);border-radius:6px;padding:1px 6px}
.menu .bd.r{background:var(--erro-50);color:var(--erro)}
.up{margin-top:14px;background:var(--branco);border-radius:14px;padding:16px 14px 14px;display:grid;justify-items:center;text-align:center;gap:6px}
.up b{font-size:14px;font-weight:500}
.up p{font-family:var(--f-t);font-size:11.5px;line-height:1.45;color:var(--t2)}
.btn-dark{width:100%;margin-top:4px;background:var(--fluxo-900);color:var(--luz);border:0;border-radius:999px;padding:9px;font-size:12px;cursor:pointer}

.main{min-width:0;padding:12px 14px 28px 4px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px;padding:6px 4px 2px;flex-wrap:wrap}
.top .ttl{flex:1 1 260px;min-width:0}
.top .ttl b{font-size:13px;font-weight:600}
.top .ttl p{font-family:var(--f-t);font-size:13px;color:var(--t2)}
.burger{display:none;width:34px;height:34px;border-radius:10px;border:1px solid #E3E3E0;background:var(--branco);cursor:pointer}
.search{flex:0 1 260px;display:flex;align-items:center;gap:8px;background:var(--branco);border:1px solid #E3E3E0;border-radius:10px;padding:7px 8px 7px 12px;font-size:12.5px;color:var(--t2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--t1)}
.search kbd{font-family:var(--f-d);font-size:10px;border:1px solid #E3E3E0;border-radius:4px;padding:1px 5px;color:var(--t3)}
.ic{width:34px;height:34px;display:grid;place-items:center;color:var(--t2);border-radius:10px;border:0;background:transparent;cursor:pointer;position:relative}
.ic:hover{background:rgba(255,255,255,.7)}
.ic .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--erro);box-shadow:0 0 0 2px var(--fundo)}
.me{width:34px;height:34px;border-radius:50%;background:var(--legado);color:var(--branco);font-size:11px;font-weight:600;display:grid;place-items:center}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;background:var(--fundo);transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none}
  .main{padding:12px}
  .burger{display:grid;place-items:center}
  .search{flex:1 1 100%;order:5}
}
.scrim{display:none}
@media (max-width:980px){.app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(24,39,94,.25);z-index:55}}

/* ===== peças comuns ===== */
.view{display:none;flex-direction:column;gap:10px;min-width:0}
.view.on{display:flex}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1240px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}.c2{grid-column:span 4}}
@media (max-width:760px){.grid>*{grid-column:span 12!important}}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px;position:relative}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ch h4{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ch .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sub{font-size:10.5px;color:var(--t3)}
.ghost,.sel{display:inline-flex;align-items:center;gap:6px;background:var(--branco);border:1px solid #E3E3E0;border-radius:8px;padding:5px 10px;font-size:11px;color:var(--t2);cursor:pointer;white-space:nowrap;text-decoration:none}
.ghost:hover,.sel:hover{border-color:var(--hidra-300)}
.dots{width:26px;height:26px;border:1px solid #E3E3E0;background:var(--branco);border-radius:7px;font-size:12px;color:var(--t2);cursor:pointer;line-height:1;flex:none}
.cta{border:0;border-radius:999px;background:var(--hidra);color:var(--branco);font-size:12px;font-weight:500;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 6px 14px -8px rgba(56,114,207,.9)}
.cta:hover{background:#3164B7}
.cta.dk{background:var(--fluxo-900);box-shadow:none}
.cta.rq{border-radius:8px}
.seg{display:inline-flex;background:var(--campo);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-size:11.5px;color:var(--t2);padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--branco);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;border-radius:5px;padding:2px 7px;white-space:nowrap}
.pill.ok{background:var(--ok-50);color:var(--ok)}
.pill.er{background:var(--erro-50);color:var(--erro)}
.pill.al{background:var(--alerta-50);color:var(--alerta-700)}
.pill.in{background:var(--hidra-50);color:var(--fluxo)}
.pill.ne{background:var(--campo);color:var(--t2)}
.pill.go{background:var(--legado-50);color:var(--legado-700)}
.delta{font-size:9.5px;font-weight:600;border-radius:4px;padding:1px 5px}
.delta.up{background:var(--ok-50);color:var(--ok)}
.delta.dn{background:var(--erro-50);color:var(--erro)}
.sq{width:28px;height:28px;border-radius:8px;border:1px solid var(--hidra-100);background:var(--hidra-50);color:var(--hidra);display:grid;place-items:center;flex:none}
.sq svg{width:14px;height:14px}
.big{font-size:22px;font-weight:600;letter-spacing:-.02em}
.mut{color:var(--t3)}
.txt{font-family:var(--f-t);font-size:13px;color:var(--t2)}
.scroll-x{overflow-x:auto}
.empty{border:1.5px dashed var(--hidra-100);background:var(--hidra-50);border-radius:12px;padding:14px;font-size:12px;color:var(--fluxo);display:flex;gap:10px;align-items:flex-start}
.empty b{font-weight:600}
.tag{font-size:9.5px;background:var(--campo);color:var(--t2);border-radius:5px;padding:2px 6px;white-space:nowrap}

/* tabela padrão do modelo 03 */
table.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;min-width:560px}
.tb th{background:var(--campo);text-align:left;font-weight:400;font-size:10px;color:var(--t3);padding:8px;white-space:nowrap}
.tb th:first-child{border-radius:8px 0 0 8px}.tb th:last-child{border-radius:0 8px 8px 0}
.tb td{padding:9px 8px;border-bottom:1px solid #EFEFEC;vertical-align:middle}
.tb td b{display:block;font-weight:600;font-size:11px}
.tb td small{font-family:var(--f-t);font-size:10.5px;color:var(--t3)}
.tb tr.cl{cursor:pointer}
.tb tr.cl:hover td{background:#FAFAF8}
.tb tr.pick td{background:var(--hidra-50)}
.tb td.r{white-space:nowrap}
.tb td>b:first-child{white-space:nowrap}
.tb td.pos{color:var(--ok);font-weight:600;white-space:nowrap}
.tb td.neg{color:var(--erro);font-weight:600;white-space:nowrap}
.tb td.r,.tb th.r{text-align:right}

/* cartão vibrante */
.hero{background:var(--hidra);border-color:var(--hidra);color:var(--branco);overflow:hidden;justify-content:space-between}
.hero .ring{position:absolute;right:-30%;top:-10%;width:120%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle at 70% 60%,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.10) 19px 30px,rgba(255,255,255,0) 31px 44px);pointer-events:none}
.hero .hh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;position:relative}
.hero .plus{width:28px;height:28px;border-radius:50%;border:0;background:var(--branco);color:var(--fluxo-900);font-size:18px;line-height:1;cursor:pointer}
.hero>b{position:relative;font-size:clamp(24px,2.2vw,32px);font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.hero>b small{font-size:11px;font-weight:500;margin-left:6px;vertical-align:top;opacity:.9}
.hero .ha{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.hero .ha button{border:0;border-radius:999px;padding:9px 8px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.hero .ha .w{background:var(--branco);color:var(--fluxo-900)}
.hero .ha .d{background:var(--fluxo-900);color:var(--luz)}
.hero p.hs{position:relative;font-size:11px;opacity:.88}

/* mini-cartões de indicador */
.kp{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;flex:1}
@media (max-width:620px){.kp{grid-template-columns:minmax(0,1fr)}}
.kp>div{border:1px solid var(--linha);border-radius:12px;padding:10px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;min-width:0}
.kp .t{font-size:12px;color:var(--t2)}
.kp b{grid-column:1/-1;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.kp .delta,.kp .pill{grid-column:1/-1;justify-self:start;margin-top:-6px}

/* gráfico */
.chartbox{position:relative;min-width:0}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;white-space:nowrap;background:var(--branco);border:1px solid #E3E3E0;border-radius:8px;box-shadow:0 8px 20px -12px rgba(0,0,0,.35);padding:7px 10px;font-size:10.5px;color:var(--t2);min-width:120px;transform:translate(-50%,-100%);z-index:3}
.tip p{color:var(--t3);margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip b{color:var(--t1);font-weight:600}
.lg{display:flex;gap:14px;font-size:11px;font-weight:500;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:2px}

/* sugestão do assistente (presente em todo o sistema) */
.aisug{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,var(--hidra-50),#F3F6FC);border:1px solid var(--hidra-100);border-radius:12px;padding:10px 12px}
.aisug .orb{width:26px;height:26px}
.aisug p{font-family:var(--f-t);font-size:12.5px;color:var(--t1);flex:1}
.aisug p .lb{font-family:var(--f-d);font-weight:600;font-size:11px;color:var(--fluxo);display:block}
.aisug p b{font-weight:700;color:var(--fluxo-900)}
.aisug .ghost{flex:none}
.orb{border-radius:50%;background:radial-gradient(circle at 34% 30%,#E3EBF8 0%,#7CA2DF 26%,#3872CF 52%,#18275E 100%);box-shadow:0 6px 16px -8px rgba(56,114,207,.8);flex:none}

/* lista genérica */
.ls{list-style:none;margin:0;padding:0;display:grid}
.ls li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0F0ED;min-width:0}
.ls li:last-child{border-bottom:0}
.ls .grow{flex:1;min-width:0}
.ls b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls small{font-family:var(--f-t);font-size:11px;color:var(--t3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;font-weight:600;color:var(--fluxo);width:42px;flex:none}
.bar-t{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* ===== assistente flutuante ===== */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;background:var(--branco);border:1px solid #E3E3E0;border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;box-shadow:0 14px 30px -14px rgba(24,39,94,.5);font-size:12px;font-weight:500}
.fab .orb{width:34px;height:34px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:70;background:var(--branco);border-left:1px solid var(--linha);box-shadow:-20px 0 50px -30px rgba(24,39,94,.5);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--linha)}
.drawer .dh .orb{width:32px;height:32px}
.drawer .dh b{display:block;font-size:13px;font-weight:600}
.drawer .dh small{font-size:11px;color:var(--t3)}
.drawer .dh .x{margin-left:auto}
.drawer .ctx{padding:10px 14px;background:var(--campo);font-size:11px;color:var(--t2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drawer .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.drawer .sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{font-size:10.5px;color:var(--t2);background:var(--campo);border:0;border-radius:7px;padding:5px 9px;cursor:pointer;text-align:left}
.chip:hover{background:var(--hidra-50);color:var(--fluxo)}
.bub{max-width:88%;font-family:var(--f-t);font-size:13px;line-height:1.5;padding:9px 12px;border-radius:12px}
.bub.ai{background:var(--campo);color:var(--t1);border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:var(--fluxo);color:var(--luz);border-bottom-right-radius:4px;align-self:flex-end}
.bub b{font-family:var(--f-d);font-weight:600;font-size:11.5px}
.composer{margin:0 14px 14px;background:var(--campo);border-radius:12px;padding:10px;display:grid;gap:8px}
.composer textarea{width:100%;border:0;outline:0;background:transparent;resize:none;font-family:var(--f-d);font-size:12.5px;color:var(--t1);min-height:38px}
.composer .b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.composer .b .sp{flex:1}
.composer .tg{font-size:10px;color:var(--t2);background:var(--branco);border-radius:6px;padding:4px 8px}
.composer .c{width:30px;height:30px;border-radius:50%;background:var(--branco);display:grid;place-items:center;color:var(--t2);border:0}
.dscrim{position:fixed;inset:0;z-index:65;background:rgba(24,39,94,.18);display:none}
.dscrim.on{display:block}

/* toast e modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fluxo-900);color:var(--luz);font-size:12px;padding:10px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:90;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(24,39,94,.3);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal .box{background:var(--branco);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;display:grid;gap:12px}
.modal .box h3{font-size:16px;font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:10.5px;color:var(--t3)}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:12.5px;color:var(--t1);background:var(--branco);border:1px solid #E3E3E0;border-radius:9px;padding:8px 10px;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--hidra)}
.fld textarea{min-height:64px;resize:vertical;font-family:var(--f-t);font-size:13px}
.fld.prov label::after{content:" · provisório";color:var(--legado-700)}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* ===== AGENDA ===== */
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h h4{font-size:16px;font-weight:600;letter-spacing:-.02em;min-width:160px}
.nav2{display:flex;gap:4px}
.nav2 button{width:30px;height:30px;border-radius:8px;border:1px solid #E3E3E0;background:var(--branco);cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.mgrid .wd{background:var(--campo);font-size:10px;color:var(--t3);padding:7px 8px;text-transform:uppercase;letter-spacing:.06em}
.mgrid .d{min-height:104px;border-top:1px solid var(--linha);border-left:1px solid var(--linha);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.mgrid .d:nth-child(7n+1){border-left:0}
.mgrid .d:hover{background:#FAFAF8}
.mgrid .d.out{background:#FAFAF8}
.mgrid .d.out .n{color:#B3B3AF}
.mgrid .d .n{font-size:11px;font-weight:600;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.mgrid .d.today .n span{background:var(--hidra);color:var(--branco);border-radius:999px;padding:1px 7px}
.mgrid .d.sun{background:repeating-linear-gradient(135deg,#FFFFFF 0 6px,#F6F6F4 6px 12px)}
.ev{font-size:10px;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c,#3872CF);background:color-mix(in srgb,var(--c,#3872CF) 12%,#FFFFFF);color:var(--t1)}
.more{font-size:10px;color:var(--t3);padding-left:4px}
@media (max-width:760px){.mgrid .d{min-height:64px}.mgrid .ev{font-size:0;padding:0;height:5px;border-left-width:0;background:var(--c)}.mgrid .more{display:none}}
.wk{display:grid;grid-template-columns:48px repeat(var(--cols,7),minmax(0,1fr));border:1px solid var(--linha);border-radius:12px;overflow:hidden;position:relative}
.wk .hd{background:var(--campo);font-size:10.5px;padding:7px 6px;text-align:center;color:var(--t2);border-left:1px solid var(--linha)}
.wk .hd b{display:block;font-size:15px;font-weight:600;color:var(--t1)}
.wk .hd.today b{color:var(--hidra)}
.wk .hr{font-size:9.5px;color:var(--t3);text-align:right;padding:2px 6px 0 0;height:44px;border-top:1px solid var(--linha2)}
.wk .cell{height:44px;border-top:1px solid var(--linha2);border-left:1px solid var(--linha);position:relative}
.wk .blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 6px;font-size:10px;line-height:1.3;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#FFFFFF);z-index:2;cursor:pointer}
.wk .blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .blk small{color:var(--t2);white-space:nowrap}
.yr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.yr{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.yr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ym{border:1px solid var(--linha);border-radius:12px;padding:10px;cursor:pointer}
.ym:hover{border-color:var(--hidra-300)}
.ym h5{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.ym h5 span{font-weight:400;color:var(--t3);font-size:10.5px}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ym .g i{font-style:normal;font-size:9px;text-align:center;padding:2px 0;border-radius:4px;color:var(--t2)}
.ym .g i.l1{background:var(--hidra-50)}
.ym .g i.l2{background:var(--hidra-100)}
.ym .g i.l3{background:var(--hidra-400);color:var(--branco)}
.ym .g i.td{outline:1.5px solid var(--fluxo)}
.leg2{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--t2)}
.leg2 span{display:inline-flex;align-items:center;gap:5px}
.leg2 i{width:10px;height:10px;border-radius:3px}

/* ===== ASSISTENTE (página) ===== */
.chatpage{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;gap:10px;min-height:calc(100vh - 120px)}
@media (max-width:1240px){.chatpage{grid-template-columns:minmax(0,1fr) 260px}.chatpage .cv{display:none}}
@media (max-width:860px){.chatpage{grid-template-columns:minmax(0,1fr)}.chatpage .kb{display:none}}
.cv .ls li{cursor:pointer;padding:9px 8px;border-radius:9px;border:0}
.cv .ls li.on{background:var(--hidra-50)}
.chatmain{padding:0;overflow:hidden}
.chatmain .head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--linha)}
.chatmain .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:340px}
.chatmain .hello{display:grid;justify-items:center;gap:8px;padding:10px 0 6px;text-align:center}
.chatmain .hello .orb{width:64px;height:64px}
.chatmain .hello b{font-size:14px;font-weight:600}
.chatmain .composer{margin:0 14px 14px}
.draft{background:var(--branco);border:1px solid var(--hidra-100);border-radius:10px;padding:10px;margin-top:8px;font-size:12.5px}
.draft .acts{margin-top:8px;justify-content:flex-start}

/* ===== ANOTAÇÕES (kanban) ===== */
.kb-alert{display:flex;gap:10px;align-items:center;background:var(--alerta-50);border:1px solid #F1DFAE;border-radius:12px;padding:10px 12px;color:var(--alerta-700);font-size:12px;flex-wrap:wrap}
.kb-alert b{font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:#E7E7E3;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--hidra);outline-offset:-2px}
.col .chd{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col .chd b{font-size:12.5px;font-weight:600}
.col .chd .n{font-size:10px;background:var(--branco);border-radius:6px;padding:1px 7px;color:var(--t2)}
.col .chd .pt{width:8px;height:8px;border-radius:50%}
.col .add{border:1.5px dashed #C9C9C5;background:transparent;border-radius:10px;padding:7px;font-size:11.5px;color:var(--t2);cursor:pointer}
.tk{background:var(--branco);border-radius:11px;padding:10px;display:grid;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid transparent}
.tk:hover{border-color:var(--hidra-100)}
.tk.drag{opacity:.45}
.tk .tt{display:flex;gap:8px;align-items:flex-start}
.tk .tt input{margin-top:2px;accent-color:var(--ok);width:15px;height:15px;flex:none}
.tk .tt b{font-size:12px;font-weight:600;line-height:1.35}
.tk.done .tt b{text-decoration:line-through;color:var(--t3)}
.tk p{font-family:var(--f-t);font-size:12px;color:var(--t2)}
.tk .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk .ft .sp{flex:1}
.tk .who{width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:600;display:grid;place-items:center;background:var(--trigo);color:var(--fluxo)}
.tk .late{color:var(--erro);font-weight:600}
.tk .chk{font-size:10px;color:var(--t3)}

/* ===== ORDENS DE SERVIÇO ===== */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:11px;padding:6px 10px;border-radius:999px;background:var(--campo);color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.steps span i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--branco);font-size:10px;font-weight:600}
.steps span.on{background:var(--fluxo);color:var(--luz)}
.steps span.on i{color:var(--fluxo)}
.steps span.ok i{background:var(--ok);color:var(--branco)}
.a4wrap{background:#E7E7E3;border-radius:12px;padding:14px;display:grid;place-items:center}
.a4{container-type:inline-size;width:100%;max-width:440px;aspect-ratio:210/297;background:var(--branco);box-shadow:0 10px 30px -18px rgba(0,0,0,.45);border-radius:3px;overflow:hidden}
.a4 .pg{height:100%;padding:6cqw 6.5cqw;display:flex;flex-direction:column;gap:2cqw;font-size:2.5cqw;color:var(--t1)}
.a4 .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:.5cqw solid var(--fluxo);padding-bottom:2.4cqw}
.a4 .hd b{font-size:4.2cqw;font-weight:600;color:var(--fluxo);display:block}
.a4 .hd small{font-family:var(--f-t);font-size:2.2cqw;color:var(--t2)}
.a4 .no{text-align:right}
.a4 .no b{font-size:3.4cqw;color:var(--t1)}
.a4 .sec{display:grid;gap:1cqw}
.a4 .sec h6{margin:0;font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--hidra);font-weight:600}
.a4 .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1cqw 3cqw}
.a4 .kv div{border-bottom:.2cqw solid var(--linha);padding-bottom:.8cqw}
.a4 .kv small{display:block;font-size:1.9cqw;color:var(--t3)}
.a4 .kv span{font-size:2.5cqw}
.a4 .box2{border:.25cqw solid var(--linha);border-radius:1.2cqw;padding:2cqw;font-family:var(--f-t);font-size:2.3cqw;line-height:1.5;color:var(--t2)}
.a4 .sig{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6cqw;padding-top:6cqw}
.a4 .sig div{border-top:.25cqw solid var(--t1);text-align:center;font-size:2cqw;padding-top:1cqw;color:var(--t2)}
.a4 .gar{background:var(--legado-50);border-left:.8cqw solid var(--legado);padding:1.6cqw 2cqw;font-size:2.3cqw}
.a4 .ft{font-size:1.9cqw;color:var(--t3);display:flex;justify-content:space-between;border-top:.2cqw solid var(--linha);padding-top:1.4cqw}
.drive{display:flex;align-items:center;gap:8px;font-size:11.5px;background:var(--campo);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.drive code{font-family:var(--f-d);font-size:11px;color:var(--fluxo);background:var(--branco);border-radius:6px;padding:2px 6px;overflow-wrap:anywhere}

/* ===== E-MAILS ===== */
.mail{display:grid;grid-template-columns:200px minmax(260px,360px) minmax(0,1fr);gap:10px;min-height:calc(100vh - 120px)}
@media (max-width:1240px){.mail{grid-template-columns:minmax(240px,320px) minmax(0,1fr)}.mail .fold{display:none}}
@media (max-width:820px){.mail{grid-template-columns:minmax(0,1fr)}}
.fold .ls li{cursor:pointer;padding:8px 10px;border-radius:9px;border:0;font-size:12px}
.fold .ls li.on{background:var(--hidra-50);color:var(--fluxo);font-weight:600}
.fold .ls li .n{margin-left:auto;font-size:10px}
.mlist{padding:8px}
.mlist .it{padding:10px;border-radius:10px;display:grid;gap:3px;cursor:pointer;border-bottom:1px solid #F0F0ED}
.mlist .it:hover{background:#FAFAF8}
.mlist .it.on{background:var(--hidra-50)}
.mlist .it .r1{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.mlist .it .r1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .it.unread .r1 b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hidra);margin-right:6px;vertical-align:middle}
.mlist .it .s{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .it .p{font-family:var(--f-t);font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mread .meta{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--linha);padding-bottom:10px;flex-wrap:wrap}
.mread .meta .grow{flex:1;min-width:0}
.mread h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.mread .body{font-family:var(--f-t);font-size:13.5px;line-height:1.6;color:var(--t1);white-space:pre-line}

/* ===== CLIENTES / FUNCIONÁRIOS ===== */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.prof{display:flex;gap:12px;align-items:center}
.prof .bigav{width:52px;height:52px;border-radius:14px;background:var(--fluxo);color:var(--luz);display:grid;place-items:center;font-size:16px;font-weight:600;flex:none}
.prof h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.kv2{grid-template-columns:minmax(0,1fr)}}
.kv2 div{background:var(--campo);border-radius:10px;padding:8px 10px;min-width:0}
.kv2 small{display:block;font-size:10px;color:var(--t3)}
.kv2 span{font-size:12px;font-weight:500;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:6px;top:20px;bottom:-8px;width:2px;background:var(--linha)}
.tl li:last-child::before{display:none}
.tl .pt{width:14px;height:14px;border-radius:50%;border:3px solid var(--hidra);background:var(--branco);margin-top:2px}
.tl b{font-size:12px;font-weight:600;display:block}
.tl small{font-family:var(--f-t);font-size:11px;color:var(--t3)}
.gbar{height:8px;border-radius:99px;background:var(--linha2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--legado)}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{border:1px solid #E3E3E0;background:var(--branco);border-radius:999px;font-size:11px;padding:5px 11px;color:var(--t2);cursor:pointer}
.filt button[aria-pressed="true"]{background:var(--fluxo);border-color:var(--fluxo);color:var(--luz)}
.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sizes div{border:1px solid var(--linha);border-radius:10px;padding:8px;text-align:center}
.sizes small{display:block;font-size:10px;color:var(--t3)}
.sizes b{font-size:17px;font-weight:600}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:10px;padding:8px 10px}
.doc .grow{flex:1;min-width:0}
.doc b{font-size:12px;font-weight:600;display:block}
.doc small{font-size:10.5px;color:var(--t3)}

/* ===== integrações / relatórios / ajuda ===== */
.intg{display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:12px;padding:10px}
.intg .lg2{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--branco);flex:none}
.intg .grow{flex:1;min-width:0}
.intg b{display:block;font-size:12.5px;font-weight:600}
.intg small{font-size:11px;color:var(--t3)}
.rep{border:1px solid var(--linha);border-radius:12px;padding:12px;display:grid;gap:6px;cursor:pointer;text-align:left;background:var(--branco)}
.rep:hover,.rep[aria-pressed="true"]{border-color:var(--hidra);box-shadow:0 0 0 3px var(--hidra-50)}
.rep b{font-size:12.5px;font-weight:600}
.rep small{font-family:var(--f-t);font-size:11.5px;color:var(--t3)}
.rep .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
details.faq{border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
details.faq summary{cursor:pointer;font-size:12.5px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";color:var(--hidra);font-size:16px;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{font-family:var(--f-t);font-size:13px;color:var(--t2);margin-top:8px}
.tgl{width:36px;height:20px;border-radius:99px;background:#D7D7D3;position:relative;border:0;cursor:pointer;flex:none}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--branco);transition:left .15s}
.tgl[aria-pressed="true"]{background:var(--hidra)}
.tgl[aria-pressed="true"]::after{left:18px}
.ex-note{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--legado-700);background:var(--legado-50);border-radius:6px;padding:4px 8px}

/* ===== rodada 1 de ajustes ===== */
button.ev{font-family:inherit;text-align:left;border-top:0;border-right:0;border-bottom:0;cursor:pointer;width:100%;display:block}
button.ev:hover,button.ev.on{background:color-mix(in srgb,var(--c) 26%,#FFFFFF)}
button.ev.on{box-shadow:0 0 0 1.5px var(--c)}
.mgrid .d.selday{background:var(--hidra-50)}
.wk button.blk{font-family:inherit;text-align:left;border-top:0;border-right:0;border-bottom:0;color:var(--t1);display:block}
.wk .blk:hover,.wk .blk.on{background:color-mix(in srgb,var(--c) 28%,#FFFFFF)}
.wk .blk.on{box-shadow:0 0 0 1.5px var(--c);z-index:3}
.wk .hd[data-day]{cursor:pointer}
.sdl li[data-ev]{cursor:pointer;padding:9px 6px;margin:0 -6px;border-radius:9px}
.sdl li[data-ev]:hover,.sdl li[data-ev]:focus-visible{background:var(--campo);outline:0}
.chev{color:var(--t3);font-size:15px;line-height:1}
#sdCard>.ghost{justify-self:start;align-self:flex-start}
.evc{display:grid;gap:10px}
.evh{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--c) 10%,#FFFFFF);border-left:4px solid var(--c);display:grid;gap:3px}
.evh small{font-size:10.5px;color:var(--t2)}
.evh b{font-size:15px;font-weight:600;color:var(--t1)}
.evh span{font-family:var(--f-t);font-size:11.5px;color:var(--t2)}
.evc .sub{margin-bottom:-4px}
.svl{display:flex;flex-direction:column;gap:5px}
.svl span{font-size:11.5px;padding:5px 9px 5px 8px;border-radius:8px;background:var(--campo);border-left:3px solid var(--c);line-height:1.3}
.evc .kv2 em{display:block;font-style:normal;font-size:10.5px;color:var(--legado-700);font-weight:400}
.evc .kv2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.dlist li{font-size:11px;padding:4px 8px;border-radius:7px;background:var(--campo);cursor:pointer}
.dlist li.on{background:var(--fluxo);color:var(--branco)}
.evc .acts{justify-content:flex-start;flex-wrap:wrap}
/* campo de cliente com sugestões */
.cpick{position:relative}
.cpl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;list-style:none;margin:0;padding:5px;background:var(--branco);border:1px solid #E3E3E0;border-radius:11px;box-shadow:0 10px 30px rgba(24,39,94,.14);max-height:260px;overflow:auto}
.cpl[hidden]{display:none}
.cpl li{padding:7px 9px;border-radius:8px;cursor:pointer;display:grid;gap:1px}
.cpl li b{font-size:12.5px;font-weight:600}
.cpl li small{font-size:10.5px;color:var(--t3)}
.cpl li:hover,.cpl li.on{background:var(--hidra-50)}
.cpl li.nv{display:flex;align-items:center;gap:6px;color:var(--hidra);font-size:12px;font-weight:600;border-top:1px solid var(--linha);border-radius:0 0 8px 8px;margin-top:3px}
.fld .lbl{font-size:10.5px;color:var(--t3)}
.fld .lbl small{font-size:10.5px}
.lrow{display:flex;justify-content:space-between;align-items:center}
.lnk{border:0;background:none;color:var(--hidra);font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0}
.lnk:hover{text-decoration:underline}
.svpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:560px){.svpick{grid-template-columns:minmax(0,1fr)}}
.svpick label{display:flex;align-items:center;gap:8px;border:1px solid #E3E3E0;border-radius:9px;padding:7px 9px;font-size:12px;color:var(--t1);cursor:pointer;line-height:1.3}
.svpick label:hover{border-color:var(--hidra-100)}
.svpick label:has(input:checked){border-color:var(--hidra);background:var(--hidra-50)}
.svpick input{accent-color:var(--hidra);width:15px;height:15px;flex:none;margin:0}
.svpick i{width:7px;height:7px;border-radius:50%;flex:none}
#evDates{display:grid;gap:6px}

function cashflow(svg,tip,pin){
  var M=CF.M,rec=CF.rec,des=CF.des,W=520,H=210,L=34,R=6,T=14,B=22,mid=T+(H-T-B)/2,half=(H-T-B)/2,max=250,font="Lexend Deca, sans-serif";
  function yv(v){return mid-(v/max)*half}
  [250,125,0,-125,-250].forEach(function(v){el("line",{x1:L,x2:W-R,y1:yv(v),y2:yv(v),stroke:v===0?"#CAC9C5":"#EDEDEA","stroke-width":1},svg);var t=el("text",{x:L-6,y:yv(v)+3.5,"text-anchor":"end","font-size":9,fill:"#868684","font-family":font},svg);t.textContent=v===0?"0":(v>0?"":"−")+Math.abs(v)+"k"});
  var step=(W-L-R)/12,bw=step*.54,bars=[];
  M.forEach(function(m,i){
    var cx=L+step*i+step/2,x=cx-bw/2;
    var hl=el("rect",{x:x-4,y:yv(rec[i])-4,width:bw+8,height:yv(-des[i])-yv(rec[i])+8,rx:6,fill:"none",stroke:"#5A8AD7","stroke-width":1.2,visibility:"hidden"},svg);
    el("rect",{x:x,y:yv(rec[i]),width:bw,height:mid-yv(rec[i])-1,rx:4,fill:"#18275E"},svg);
    el("rect",{x:x,y:mid+1,width:bw,height:yv(-des[i])-mid-1,rx:4,fill:"#5A8AD7"},svg);
    var t=el("text",{x:cx,y:H-6,"text-anchor":"middle","font-size":9,fill:"#4A4A49","font-family":font},svg);t.textContent=m;
    var hit=el("rect",{x:L+step*i,y:T,width:step,height:H-T-B,fill:"transparent"},svg);
    bars.push({hl:hl,cx:cx});
    hit.addEventListener("pointerenter",function(){show(i)});hit.addEventListener("pointerleave",function(){show(pin)});
  });
  function show(i){
    bars.forEach(function(b,j){b.hl.setAttribute("visibility",j===i?"visible":"hidden")});
    tip.innerHTML="<p>"+M[i]+" "+CF.Y[i]+"</p><div><span>Receitas</span><b>R$ "+rec[i]+" mil</b></div><div><span>Despesas</span><b>R$ "+des[i]+" mil</b></div>";

  }
  show(pin);
  return show;
}
function donut(svg,parts,label,value){
  var cx=100,cy=100,ro=82,ri=56,acc=0,font="Lexend Deca, sans-serif";
  function pt(r,f){var a=-Math.PI/2+f*2*Math.PI;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  parts.forEach(function(p){
    var f0=acc/100+.006,f1=(acc+p[0])/100-.006;acc+=p[0];
    var a=pt(ro,f0),b=pt(ro,f1),c=pt(ri,f1),e=pt(ri,f0),lg=(f1-f0)>.5?1:0;
    el("path",{d:"M"+a+" A"+ro+" "+ro+" 0 "+lg+" 1 "+b+" L"+c+" A"+ri+" "+ri+" 0 "+lg+" 0 "+e+" Z",fill:p[1]},svg);
  });
  el("circle",{cx:cx,cy:cy,r:ri-4,fill:"#FFFFFF",stroke:"#EDEDEA","stroke-width":1},svg);
  var t1=el("text",{x:cx,y:cy-8,"text-anchor":"middle","font-size":8.5,fill:"#868684","font-family":font},svg);t1.textContent=label;

}
function barsChart(svg,tip,labels,vals,fmt,hiLast){

  });
}
