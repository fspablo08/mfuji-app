<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Monte Fuji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Sulphur+Point:wght@300;400;700&display=swap">
<style>
/* Layout: app de tela cheia no modelo 03 (Fynix) — menu lateral sobre cinza, cartões brancos de 16px, um cartão vibrante em HIDRA por tela.
   Aparência única e clara por escolha: as cores da marca precisam aparecer exatas. */
:root{
  --fluxo:#253C8D; --fluxo-900:#18275E; --fluxo-50:#E6E8F2; --fluxo-100:#CAD0E3;
  --hidra:#3872CF; --hidra-400:#5A8AD7; --hidra-300:#7CA2DF; --hidra-100:#C0D3F0; --hidra-50:#E3EBF8;
  --luz:#F7F6F1; --trigo:#E7E4C7; --legado:#B49B54; --legado-700:#817249; --legado-50:#F4F1E7; --carvao:#2C2C2C;
  --branco:#FFFFFF; --fundo:#EFEFEC; --linha:#E6E6E3; --linha2:#EDEDEA; --campo:#F4F4F2;
  --t1:#2C2C2C; --t2:#4A4A49; --t3:#868684;
  --ok:#2F8F5B; --ok-50:#E5F2EA; --alerta:#D9A21B; --alerta-50:#FBF1D9; --alerta-700:#8A6510; --erro:#C2413A; --erro-50:#F8E6E5;
  --f-d:"Lexend Deca","Lexend",ui-sans-serif,system-ui,sans-serif;
  --f-t:"Sulphur Point",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--fundo)}
body{color:var(--t1);font-family:var(--f-d);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hidra);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== casca ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 16px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:9px;padding:2px 6px 14px}
.logo .mk{width:30px;height:30px;border-radius:50%;background:var(--fluxo);display:grid;place-items:center;flex:none}
.logo b{font-size:15px;font-weight:600}
.logo b span{color:var(--hidra)}
.acc{display:flex;align-items:center;gap:10px;background:var(--branco);border:1px solid #E3E3E0;border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;margin-bottom:4px}
.acc>span:nth-child(2){flex:1;min-width:0}
.acc b{display:block;font-size:12px;font-weight:500;white-space:nowrap}
.acc small{font-size:10.5px;color:var(--t3);white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--fluxo);color:var(--luz);font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.grp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:12px 8px 3px}
.menu{display:grid;gap:1px}
.menu a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;font-size:12.5px;color:var(--t2);text-decoration:none}
.menu a:hover{background:rgba(255,255,255,.65)}
.menu a.on{background:var(--branco);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.menu a.on svg{color:var(--hidra)}
.menu svg{width:15px;height:15px;flex:none}
.menu .bd{margin-left:auto;font-size:10px;font-weight:600;background:var(--hidra-50);color:var(--fluxo);border-radius:6px;padding:1px 6px}
.menu .bd.r{background:var(--erro-50);color:var(--erro)}
.up{margin-top:14px;background:var(--branco);border-radius:14px;padding:16px 14px 14px;display:grid;justify-items:center;text-align:center;gap:6px}
.up b{font-size:14px;font-weight:500}
.up p{font-family:var(--f-t);font-size:11.5px;line-height:1.45;color:var(--t2)}
.btn-dark{width:100%;margin-top:4px;background:var(--fluxo-900);color:var(--luz);border:0;border-radius:999px;padding:9px;font-size:12px;cursor:pointer}

.main{min-width:0;padding:12px 14px 28px 4px;display:flex;flex-direction:column;gap:10px}
.top{display:none;align-items:center;gap:10px;padding:2px 4px}
.burger{display:none;width:34px;height:34px;border-radius:10px;border:1px solid #E3E3E0;background:var(--branco);cursor:pointer}
#syncSt.err{color:var(--erro,#C2413A)}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;background:var(--fundo);transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none}
  .main{padding:12px}
  .top{display:flex}
  .burger{display:grid;place-items:center}
}
.scrim{display:none}
@media (max-width:980px){.app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(24,39,94,.25);z-index:55}}

/* ===== peças comuns ===== */
.view{display:none;flex-direction:column;gap:10px;min-width:0}
.view.on{display:flex}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
/* Agenda: coluna da direita com o dia em destaque em cima e "Melhores datas" no pé */
.agside{display:flex;flex-direction:column;gap:10px}
@media (min-width:1241px){.agside #sdCard{flex:1 0 auto;min-height:420px}}
.agside .bestcard{margin-top:auto}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1240px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}.c2{grid-column:span 4}}
@media (max-width:760px){.grid>*{grid-column:span 12!important}}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px;position:relative}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ch h4{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ch .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sub{font-size:10.5px;color:var(--t3)}
.ghost,.sel{display:inline-flex;align-items:center;gap:6px;background:var(--branco);border:1px solid #E3E3E0;border-radius:8px;padding:5px 10px;font-size:11px;color:var(--t2);cursor:pointer;white-space:nowrap;text-decoration:none}
.ghost:hover,.sel:hover{border-color:var(--hidra-300)}
.dots{width:26px;height:26px;border:1px solid #E3E3E0;background:var(--branco);border-radius:7px;font-size:12px;color:var(--t2);cursor:pointer;line-height:1;flex:none}
.cta{border:0;border-radius:999px;background:var(--hidra);color:var(--branco);font-size:12px;font-weight:500;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 6px 14px -8px rgba(56,114,207,.9)}
.cta:hover{background:#3164B7}
.cta.dk{background:var(--fluxo-900);box-shadow:none}
.cta.rq{border-radius:8px}
.seg{display:inline-flex;background:var(--campo);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-size:11.5px;color:var(--t2);padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--branco);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;border-radius:5px;padding:2px 7px;white-space:nowrap}
.pill.ok{background:var(--ok-50);color:var(--ok)}
.pill.er{background:var(--erro-50);color:var(--erro)}
.pill.al{background:var(--alerta-50);color:var(--alerta-700)}
.pill.in{background:var(--hidra-50);color:var(--fluxo)}
.pill.ne{background:var(--campo);color:var(--t2)}
.pill.go{background:var(--legado-50);color:var(--legado-700)}
.delta{font-size:9.5px;font-weight:600;border-radius:4px;padding:1px 5px}
.delta.up{background:var(--ok-50);color:var(--ok)}
.delta.dn{background:var(--erro-50);color:var(--erro)}
.sq{width:28px;height:28px;border-radius:8px;border:1px solid var(--hidra-100);background:var(--hidra-50);color:var(--hidra);display:grid;place-items:center;flex:none}
.sq svg{width:14px;height:14px}
.big{font-size:22px;font-weight:600;letter-spacing:-.02em}
.mut{color:var(--t3)}
.txt{font-family:var(--f-t);font-size:13px;color:var(--t2)}
.scroll-x{overflow-x:auto}
.empty{border:1.5px dashed var(--hidra-100);background:var(--hidra-50);border-radius:12px;padding:14px;font-size:12px;color:var(--fluxo);display:flex;gap:10px;align-items:flex-start}
.empty b{font-weight:600}
.tag{font-size:9.5px;background:var(--campo);color:var(--t2);border-radius:5px;padding:2px 6px;white-space:nowrap}

/* tabela padrão do modelo 03 */
table.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;min-width:560px}
.tb th{background:var(--campo);text-align:left;font-weight:400;font-size:10px;color:var(--t3);padding:8px;white-space:nowrap}
.tb th:first-child{border-radius:8px 0 0 8px}.tb th:last-child{border-radius:0 8px 8px 0}
.tb td{padding:9px 8px;border-bottom:1px solid #EFEFEC;vertical-align:middle}
.tb td b{display:block;font-weight:600;font-size:11px}
.tb td small{font-family:var(--f-t);font-size:10.5px;color:var(--t3)}
.tb tr.cl{cursor:pointer}
.tb tr.cl:hover td{background:#FAFAF8}
.tb tr.pick td{background:var(--hidra-50)}
.tb td.r{white-space:nowrap}
.tb td>b:first-child{white-space:nowrap}
.tb td.pos{color:var(--ok);font-weight:600;white-space:nowrap}
.tb td.neg{color:var(--erro);font-weight:600;white-space:nowrap}
.tb td.r,.tb th.r{text-align:right}

/* cartão vibrante */
.hero{background:var(--hidra);border-color:var(--hidra);color:var(--branco);overflow:hidden;justify-content:space-between}
.hero .ring{position:absolute;right:-30%;top:-10%;width:120%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle at 70% 60%,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.10) 19px 30px,rgba(255,255,255,0) 31px 44px);pointer-events:none}
.hero .hh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;position:relative}
.hero .plus{width:28px;height:28px;border-radius:50%;border:0;background:var(--branco);color:var(--fluxo-900);font-size:18px;line-height:1;cursor:pointer}
.hero>b{position:relative;font-size:clamp(24px,2.2vw,32px);font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.hero>b small{font-size:11px;font-weight:500;margin-left:6px;vertical-align:top;opacity:.9}
.hero .ha{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.hero .ha button{border:0;border-radius:999px;padding:9px 8px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.hero .ha .w{background:var(--branco);color:var(--fluxo-900)}
.hero .ha .d{background:var(--fluxo-900);color:var(--luz)}
.hero p.hs{position:relative;font-size:11px;opacity:.88}

/* mini-cartões de indicador */
.kp{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;flex:1}
@media (max-width:620px){.kp{grid-template-columns:minmax(0,1fr)}}
.kp>div{border:1px solid var(--linha);border-radius:12px;padding:10px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;min-width:0}
.kp .t{font-size:12px;color:var(--t2)}
.kp b{grid-column:1/-1;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.kp .delta,.kp .pill{grid-column:1/-1;justify-self:start;margin-top:-6px}

/* gráfico */
.chartbox{position:relative;min-width:0}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;white-space:nowrap;background:var(--branco);border:1px solid #E3E3E0;border-radius:8px;box-shadow:0 8px 20px -12px rgba(0,0,0,.35);padding:7px 10px;font-size:10.5px;color:var(--t2);min-width:120px;transform:translate(-50%,-100%);z-index:3}
.tip p{color:var(--t3);margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip b{color:var(--t1);font-weight:600}
.lg{display:flex;gap:14px;font-size:11px;font-weight:500;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:2px}

/* sugestão do assistente (presente em todo o sistema) */
.aisug{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,var(--hidra-50),#F3F6FC);border:1px solid var(--hidra-100);border-radius:12px;padding:10px 12px}
.aisug .orb{width:26px;height:26px}
.aisug p{font-family:var(--f-t);font-size:12.5px;color:var(--t1);flex:1}
.aisug p .lb{font-family:var(--f-d);font-weight:600;font-size:11px;color:var(--fluxo);display:block}
.aisug p b{font-weight:700;color:var(--fluxo-900)}
.aisug .ghost{flex:none}
.orb{border-radius:50%;background:radial-gradient(circle at 34% 30%,#E3EBF8 0%,#7CA2DF 26%,#3872CF 52%,#18275E 100%);box-shadow:0 6px 16px -8px rgba(56,114,207,.8);flex:none}

/* lista genérica */
.ls{list-style:none;margin:0;padding:0;display:grid}
.ls li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0F0ED;min-width:0}
.ls li:last-child{border-bottom:0}
.ls .grow{flex:1;min-width:0}
.ls b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls small{font-family:var(--f-t);font-size:11px;color:var(--t3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;font-weight:600;color:var(--fluxo);width:42px;flex:none}
.bar-t{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* ===== assistente flutuante ===== */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;background:var(--branco);border:1px solid #E3E3E0;border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;box-shadow:0 14px 30px -14px rgba(24,39,94,.5);font-size:12px;font-weight:500}
.fab .orb{width:34px;height:34px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:70;background:var(--branco);border-left:1px solid var(--linha);box-shadow:-20px 0 50px -30px rgba(24,39,94,.5);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--linha)}
.drawer .dh .orb{width:32px;height:32px}
.drawer .dh b{display:block;font-size:13px;font-weight:600}
.drawer .dh small{font-size:11px;color:var(--t3)}
.drawer .dh .x{margin-left:auto}
.drawer .ctx{padding:10px 14px;background:var(--campo);font-size:11px;color:var(--t2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drawer .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.drawer .sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{font-size:10.5px;color:var(--t2);background:var(--campo);border:0;border-radius:7px;padding:5px 9px;cursor:pointer;text-align:left}
.chip:hover{background:var(--hidra-50);color:var(--fluxo)}
.bub{max-width:88%;font-family:var(--f-t);font-size:13px;line-height:1.5;padding:9px 12px;border-radius:12px}
.bub.ai{background:var(--campo);color:var(--t1);border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:var(--fluxo);color:var(--luz);border-bottom-right-radius:4px;align-self:flex-end}
.bub b{font-family:var(--f-d);font-weight:600;font-size:11.5px}
.composer{margin:0 14px 14px;background:var(--campo);border-radius:12px;padding:10px;display:grid;gap:8px}
.composer textarea{width:100%;border:0;outline:0;background:transparent;resize:none;font-family:var(--f-d);font-size:12.5px;color:var(--t1);min-height:38px}
.composer .b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.composer .b .sp{flex:1}
.composer .tg{font-size:10px;color:var(--t2);background:var(--branco);border-radius:6px;padding:4px 8px}
.composer .c{width:30px;height:30px;border-radius:50%;background:var(--branco);display:grid;place-items:center;color:var(--t2);border:0}
.dscrim{position:fixed;inset:0;z-index:65;background:rgba(24,39,94,.18);display:none}
.dscrim.on{display:block}

/* toast e modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fluxo-900);color:var(--luz);font-size:12px;padding:10px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:90;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(24,39,94,.3);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal .box{background:var(--branco);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;display:grid;gap:12px}
.modal .box h3{font-size:16px;font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:10.5px;color:var(--t3)}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:12.5px;color:var(--t1);background:var(--branco);border:1px solid #E3E3E0;border-radius:9px;padding:8px 10px;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--hidra)}
.fld textarea{min-height:64px;resize:vertical;font-family:var(--f-t);font-size:13px}
.fld.prov label::after{content:" · provisório";color:var(--legado-700)}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* ===== AGENDA ===== */
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h h4{font-size:16px;font-weight:600;letter-spacing:-.02em;min-width:160px}
.nav2{display:flex;gap:4px}
.agsrch{position:relative;flex:1 1 150px;max-width:300px;margin-left:auto}
.agq{display:flex;align-items:center;gap:7px;background:var(--branco);border:1px solid #E3E3E0;border-radius:9px;padding:6px 10px;color:var(--t3);cursor:text}
.agq:focus-within{border-color:var(--hidra)}
.agq input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:12.5px;color:var(--t1)}
.agres{position:absolute;top:calc(100% + 6px);right:0;width:min(360px,calc(100vw - 32px));max-height:420px;overflow:auto;background:var(--branco);border:1px solid #E3E3E0;border-radius:12px;box-shadow:0 12px 32px rgba(24,39,94,.14);padding:8px 10px;z-index:40}
.agres .sub{margin:6px 2px 2px}
.agres .mut{margin:6px 2px;font-size:12px}
.agres .ls li{cursor:pointer;padding:8px 6px;border-radius:8px;border-bottom:0}
.agres .ls li:hover,.agres .ls li:focus{background:var(--hidra-50);outline:0}
.agres .tm{display:flex;flex-direction:column;font-size:11.5px;width:76px}
.agres .tm small{font-weight:400}
#calCard{container:cal/inline-size}
@container cal (max-width:820px){.agsrch{flex:1 1 100%;max-width:none;order:5}.agres{left:0;right:auto;width:min(100%,440px)}}
.nav2 button{width:30px;height:30px;border-radius:8px;border:1px solid #E3E3E0;background:var(--branco);cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.mgrid .wd{background:var(--campo);font-size:10px;color:var(--t3);padding:7px 8px;text-transform:uppercase;letter-spacing:.06em}
.mgrid .d{min-height:104px;border-top:1px solid var(--linha);border-left:1px solid var(--linha);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.mgrid .d:nth-child(7n+1){border-left:0}
.mgrid .d:hover{background:#FAFAF8}
.mgrid .d.out{background:#FAFAF8}
.mgrid .d.out .n{color:#B3B3AF}
.mgrid .d .n{font-size:11px;font-weight:600;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.mgrid .d.today .n span{background:var(--hidra);color:var(--branco);border-radius:999px;padding:1px 7px}
.mgrid .d.sun{background:repeating-linear-gradient(135deg,#FFFFFF 0 6px,#F6F6F4 6px 12px)}
.ev{font-size:10px;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c,#3872CF);background:color-mix(in srgb,var(--c,#3872CF) 12%,#FFFFFF);color:var(--t1)}
.more{font-size:10px;color:var(--t3);padding-left:4px}
@media (max-width:760px){.mgrid .d{min-height:64px}.mgrid .ev{font-size:0;padding:0;height:5px;border-left-width:0;background:var(--c)}.mgrid .more{display:none}}
.wk{display:grid;grid-template-columns:48px repeat(var(--cols,7),minmax(0,1fr));border:1px solid var(--linha);border-radius:12px;overflow:hidden;position:relative}
.wk .hd{background:var(--campo);font-size:10.5px;padding:7px 6px;text-align:center;color:var(--t2);border-left:1px solid var(--linha)}
.wk .hd b{display:block;font-size:15px;font-weight:600;color:var(--t1)}
.wk .hd.today b{color:var(--hidra)}
.wk .hr{font-size:9.5px;color:var(--t3);text-align:right;padding:2px 6px 0 0;height:44px;border-top:1px solid var(--linha2)}
.wk .cell{height:44px;border-top:1px solid var(--linha2);border-left:1px solid var(--linha);position:relative}
.wk .blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 6px;font-size:10px;line-height:1.3;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#FFFFFF);z-index:2;cursor:pointer}
.wk .blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .blk small{color:var(--t2);white-space:nowrap}
.yr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.yr{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.yr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ym{border:1px solid var(--linha);border-radius:12px;padding:10px;cursor:pointer}
.ym:hover{border-color:var(--hidra-300)}
.ym h5{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.ym h5 span{font-weight:400;color:var(--t3);font-size:10.5px}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ym .g i{font-style:normal;font-size:9px;text-align:center;padding:2px 0;border-radius:4px;color:var(--t2)}
.ym .g i.l1{background:var(--hidra-50)}
.ym .g i.l2{background:var(--hidra-100)}
.ym .g i.l3{background:var(--hidra-400);color:var(--branco)}
.ym .g i.td{outline:1.5px solid var(--fluxo)}
.leg2{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--t2)}
.leg2 span{display:inline-flex;align-items:center;gap:5px}
.leg2 i{width:10px;height:10px;border-radius:3px}

/* ===== ASSISTENTE (página) ===== */
.chatpage{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;gap:10px;min-height:calc(100vh - 120px)}
@media (max-width:1240px){.chatpage{grid-template-columns:minmax(0,1fr) 260px}.chatpage .cv{display:none}}
@media (max-width:860px){.chatpage{grid-template-columns:minmax(0,1fr)}.chatpage .kb{display:none}}
.cv .ls li{cursor:pointer;padding:9px 8px;border-radius:9px;border:0}
.cv .ls li.on{background:var(--hidra-50)}
.chatmain{padding:0;overflow:hidden}
.chatmain .head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--linha)}
.chatmain .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:340px}
.chatmain .hello{display:grid;justify-items:center;gap:8px;padding:10px 0 6px;text-align:center}
.chatmain .hello .orb{width:64px;height:64px}
.chatmain .hello b{font-size:14px;font-weight:600}
.chatmain .composer{margin:0 14px 14px}
.draft{background:var(--branco);border:1px solid var(--hidra-100);border-radius:10px;padding:10px;margin-top:8px;font-size:12.5px}
.draft .acts{margin-top:8px;justify-content:flex-start}

/* ===== ANOTAÇÕES (kanban) ===== */
.kb-alert{display:flex;gap:10px;align-items:center;background:var(--alerta-50);border:1px solid #F1DFAE;border-radius:12px;padding:10px 12px;color:var(--alerta-700);font-size:12px;flex-wrap:wrap}
.kb-alert b{font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:#E7E7E3;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--hidra);outline-offset:-2px}
.col .chd{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col .chd b{font-size:12.5px;font-weight:600}
.col .chd .n{font-size:10px;background:var(--branco);border-radius:6px;padding:1px 7px;color:var(--t2)}
.col .chd .pt{width:8px;height:8px;border-radius:50%}
.col .add{border:1.5px dashed #C9C9C5;background:transparent;border-radius:10px;padding:7px;font-size:11.5px;color:var(--t2);cursor:pointer}
.tk{background:var(--branco);border-radius:11px;padding:10px;display:grid;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid transparent}
.tk:hover{border-color:var(--hidra-100)}
.tk.drag{opacity:.45}
.tk .tt{display:flex;gap:8px;align-items:flex-start}
.tk .tt input{margin-top:2px;accent-color:var(--ok);width:15px;height:15px;flex:none}
.tk .tt b{font-size:12px;font-weight:600;line-height:1.35}
.tk.done .tt b{text-decoration:line-through;color:var(--t3)}
.tk p{font-family:var(--f-t);font-size:12px;color:var(--t2)}
.tk .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk .ft .sp{flex:1}
.tk .who{width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:600;display:grid;place-items:center;background:var(--trigo);color:var(--fluxo)}
.tk .late{color:var(--erro);font-weight:600}
.tk .chk{font-size:10px;color:var(--t3)}

/* ===== ORDENS DE SERVIÇO ===== */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:11px;padding:6px 10px;border-radius:999px;background:var(--campo);color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.steps span i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--branco);font-size:10px;font-weight:600}
.steps span.on{background:var(--fluxo);color:var(--luz)}
.steps span.on i{color:var(--fluxo)}
.steps span.ok i{background:var(--ok);color:var(--branco)}
.a4wrap{background:#E7E7E3;border-radius:12px;padding:14px;display:grid;place-items:center}
.a4{container-type:inline-size;width:100%;max-width:440px;aspect-ratio:210/297;background:var(--branco);box-shadow:0 10px 30px -18px rgba(0,0,0,.45);border-radius:3px;overflow:hidden}
.a4 .pg{height:100%;padding:6cqw 6.5cqw;display:flex;flex-direction:column;gap:2cqw;font-size:2.5cqw;color:var(--t1)}
.a4 .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:.5cqw solid var(--fluxo);padding-bottom:2.4cqw}
.a4 .hd b{font-size:4.2cqw;font-weight:600;color:var(--fluxo);display:block}
.a4 .hd small{font-family:var(--f-t);font-size:2.2cqw;color:var(--t2)}
.a4 .no{text-align:right}
.a4 .no b{font-size:3.4cqw;color:var(--t1)}
.a4 .sec{display:grid;gap:1cqw}
.a4 .sec h6{margin:0;font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--hidra);font-weight:600}
.a4 .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1cqw 3cqw}
.a4 .kv div{border-bottom:.2cqw solid var(--linha);padding-bottom:.8cqw}
.a4 .kv small{display:block;font-size:1.9cqw;color:var(--t3)}
.a4 .kv span{font-size:2.5cqw}
.a4 .box2{border:.25cqw solid var(--linha);border-radius:1.2cqw;padding:2cqw;font-family:var(--f-t);font-size:2.3cqw;line-height:1.5;color:var(--t2)}
.a4 .sig{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6cqw;padding-top:6cqw}
.a4 .sig div{border-top:.25cqw solid var(--t1);text-align:center;font-size:2cqw;padding-top:1cqw;color:var(--t2)}
.a4 .gar{background:var(--legado-50);border-left:.8cqw solid var(--legado);padding:1.6cqw 2cqw;font-size:2.3cqw}
.a4 .ft{font-size:1.9cqw;color:var(--t3);display:flex;justify-content:space-between;border-top:.2cqw solid var(--linha);padding-top:1.4cqw}
.drive{display:flex;align-items:center;gap:8px;font-size:11.5px;background:var(--campo);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.drive code{font-family:var(--f-d);font-size:11px;color:var(--fluxo);background:var(--branco);border-radius:6px;padding:2px 6px;overflow-wrap:anywhere}

/* ===== E-MAILS ===== */
.mail{display:grid;grid-template-columns:200px minmax(260px,360px) minmax(0,1fr);gap:10px;min-height:calc(100vh - 120px)}
@media (max-width:1240px){.mail{grid-template-columns:minmax(240px,320px) minmax(0,1fr)}.mail .fold{display:none}}
@media (max-width:820px){.mail{grid-template-columns:minmax(0,1fr)}}
.fold .ls li{cursor:pointer;padding:8px 10px;border-radius:9px;border:0;font-size:12px}
.fold .ls li.on{background:var(--hidra-50);color:var(--fluxo);font-weight:600}
.fold .ls li .n{margin-left:auto;font-size:10px}
.mlist{padding:8px}
.mlist .it{padding:10px;border-radius:10px;display:grid;gap:3px;cursor:pointer;border-bottom:1px solid #F0F0ED}
.mlist .it:hover{background:#FAFAF8}
.mlist .it.on{background:var(--hidra-50)}
.mlist .it .r1{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.mlist .it .r1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .it.unread .r1 b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hidra);margin-right:6px;vertical-align:middle}
.mlist .it .s{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .it .p{font-family:var(--f-t);font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mread .meta{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--linha);padding-bottom:10px;flex-wrap:wrap}
.mread .meta .grow{flex:1;min-width:0}
.mread h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.mread .body{font-family:var(--f-t);font-size:13.5px;line-height:1.6;color:var(--t1);white-space:pre-line}

/* ===== CLIENTES / FUNCIONÁRIOS ===== */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.prof{display:flex;gap:12px;align-items:center}
.prof .bigav{width:52px;height:52px;border-radius:14px;background:var(--fluxo);color:var(--luz);display:grid;place-items:center;font-size:16px;font-weight:600;flex:none}
.prof h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.kv2{grid-template-columns:minmax(0,1fr)}}
.kv2 div{background:var(--campo);border-radius:10px;padding:8px 10px;min-width:0}
.kv2 small{display:block;font-size:10px;color:var(--t3)}
.kv2 span{font-size:12px;font-weight:500;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:6px;top:20px;bottom:-8px;width:2px;background:var(--linha)}
.tl li:last-child::before{display:none}
.tl .pt{width:14px;height:14px;border-radius:50%;border:3px solid var(--hidra);background:var(--branco);margin-top:2px}
.tl b{font-size:12px;font-weight:600;display:block}
.tl small{font-family:var(--f-t);font-size:11px;color:var(--t3)}
.gbar{height:8px;border-radius:99px;background:var(--linha2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--legado)}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{border:1px solid #E3E3E0;background:var(--branco);border-radius:999px;font-size:11px;padding:5px 11px;color:var(--t2);cursor:pointer}
.filt button[aria-pressed="true"]{background:var(--fluxo);border-color:var(--fluxo);color:var(--luz)}
.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sizes div{border:1px solid var(--linha);border-radius:10px;padding:8px;text-align:center}
.sizes small{display:block;font-size:10px;color:var(--t3)}
.sizes b{font-size:17px;font-weight:600}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:10px;padding:8px 10px}
.doc .grow{flex:1;min-width:0}
.doc b{font-size:12px;font-weight:600;display:block}
.doc small{font-size:10.5px;color:var(--t3)}

/* ===== integrações / relatórios / ajuda ===== */
.intg{display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:12px;padding:10px}
.intg .lg2{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--branco);flex:none}
.intg .grow{flex:1;min-width:0}
.intg b{display:block;font-size:12.5px;font-weight:600}
.intg small{font-size:11px;color:var(--t3)}
.rep{border:1px solid var(--linha);border-radius:12px;padding:12px;display:grid;gap:6px;cursor:pointer;text-align:left;background:var(--branco)}
.rep:hover,.rep[aria-pressed="true"]{border-color:var(--hidra);box-shadow:0 0 0 3px var(--hidra-50)}
.rep b{font-size:12.5px;font-weight:600}
.rep small{font-family:var(--f-t);font-size:11.5px;color:var(--t3)}
.rep .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
details.faq{border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
details.faq summary{cursor:pointer;font-size:12.5px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";color:var(--hidra);font-size:16px;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{font-family:var(--f-t);font-size:13px;color:var(--t2);margin-top:8px}
.tgl{width:36px;height:20px;border-radius:99px;background:#D7D7D3;position:relative;border:0;cursor:pointer;flex:none}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--branco);transition:left .15s}
.tgl[aria-pressed="true"]{background:var(--hidra)}
.tgl[aria-pressed="true"]::after{left:18px}
.ex-note{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--legado-700);background:var(--legado-50);border-radius:6px;padding:4px 8px}

/* ===== rodada 1 de ajustes ===== */
button.ev{font-family:inherit;text-align:left;border-top:0;border-right:0;border-bottom:0;cursor:pointer;width:100%;display:block}
button.ev:hover,button.ev.on{background:color-mix(in srgb,var(--c) 26%,#FFFFFF)}
button.ev.on{box-shadow:0 0 0 1.5px var(--c)}
.mgrid .d.selday{background:var(--hidra-50)}
.wk button.blk{font-family:inherit;text-align:left;border-top:0;border-right:0;border-bottom:0;color:var(--t1);display:block}
.wk .blk:hover,.wk .blk.on{background:color-mix(in srgb,var(--c) 28%,#FFFFFF)}
.wk .blk.on{box-shadow:0 0 0 1.5px var(--c);z-index:3}
.wk .hd[data-day]{cursor:pointer}
.sdl li[data-ev]{cursor:pointer;padding:9px 6px;margin:0 -6px;border-radius:9px}
.sdl li[data-ev]:hover,.sdl li[data-ev]:focus-visible{background:var(--campo);outline:0}
.chev{color:var(--t3);font-size:15px;line-height:1}
#sdCard>.ghost{justify-self:start;align-self:flex-start}
.evc{display:grid;gap:10px}
.evh{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--c) 10%,#FFFFFF);border-left:4px solid var(--c);display:grid;gap:3px}
.evh small{font-size:10.5px;color:var(--t2)}
.evh b{font-size:15px;font-weight:600;color:var(--t1)}
.evh span{font-family:var(--f-t);font-size:11.5px;color:var(--t2)}
.evc .sub{margin-bottom:-4px}
.svl{display:flex;flex-direction:column;gap:5px}
.svl span{font-size:11.5px;padding:5px 9px 5px 8px;border-radius:8px;background:var(--campo);border-left:3px solid var(--c);line-height:1.3}
.evc .kv2 em{display:block;font-style:normal;font-size:10.5px;color:var(--legado-700);font-weight:400}
.evc .kv2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.dlist li{font-size:11px;padding:4px 8px;border-radius:7px;background:var(--campo);cursor:pointer}
.dlist li.on{background:var(--fluxo);color:var(--branco)}
.evc .acts{justify-content:flex-start;flex-wrap:wrap}
/* campo de cliente com sugestões */
.cpick{position:relative}
.cpl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;list-style:none;margin:0;padding:5px;background:var(--branco);border:1px solid #E3E3E0;border-radius:11px;box-shadow:0 10px 30px rgba(24,39,94,.14);max-height:260px;overflow:auto}
.cpl[hidden]{display:none}
.cpl li{padding:7px 9px;border-radius:8px;cursor:pointer;display:grid;gap:1px}
.cpl li b{font-size:12.5px;font-weight:600}
.cpl li small{font-size:10.5px;color:var(--t3)}
.cpl li:hover,.cpl li.on{background:var(--hidra-50)}
.cpl li.nv{display:flex;align-items:center;gap:6px;color:var(--hidra);font-size:12px;font-weight:600;border-top:1px solid var(--linha);border-radius:0 0 8px 8px;margin-top:3px}
.fld .lbl{font-size:10.5px;color:var(--t3)}
.fld .lbl small{font-size:10.5px}
.lrow{display:flex;justify-content:space-between;align-items:center}
.lnk{border:0;background:none;color:var(--hidra);font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0}
.lnk:hover{text-decoration:underline}
.svpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:560px){.svpick{grid-template-columns:minmax(0,1fr)}}
.svpick label{display:flex;align-items:center;gap:8px;border:1px solid #E3E3E0;border-radius:9px;padding:7px 9px;font-size:12px;color:var(--t1);cursor:pointer;line-height:1.3}
.svpick label:hover{border-color:var(--hidra-100)}
.svpick label:has(input:checked){border-color:var(--hidra);background:var(--hidra-50)}
.svpick input{accent-color:var(--hidra);width:15px;height:15px;flex:none;margin:0}

function brl(v,dec){return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:dec===0?0:2,maximumFractionDigits:dec===0?0:2})}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dmy(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(a,b){return Math.round((new Date(a)-new Date(b))/864e5)}

/* ===== banco de dados compartilhado (Cloudflare D1) =====
   O servidor entrega os dados junto com a página (window.MF_BOOT). Cada alteração na tela é
   comparada com a última versão do banco e só o que mudou é enviado. A cada poucos segundos a
   tela pergunta ao servidor o que outras pessoas mudaram e se atualiza sozinha. */
var BOOT=window.MF_BOOT||{ver:0,dados:{},usuario:null};
var EU=BOOT.usuario||{nome:"",iniciais:"",papel:"leitura",email:""};
var DB_KEYS=["CLIENTES","FUNC","OSL","EMAILS","TAREFAS","EVENTS","RECEBER","VK"];
var SYNC={ver:BOOT.ver||0,snap:{},enviando:false,fila:false,ultimo:BOOT.ver!=null?new Date():null,erro:false,pend:0,render:false};
function dbKey(k,x){if(k==="OSL")return String(x[0]);if(k==="VK")return String(x);return x&&x.id!=null?String(x.id):JSON.stringify(x)}
function dbLoad(k){var a=(BOOT.dados&&BOOT.dados[k])||[],m={};a.forEach(function(x){m[dbKey(k,x)]=JSON.stringify(x)});SYNC.snap[k]=m;return a.slice()}
/* o que mudou na tela desde a última versão do banco */
function dbOps(){var ops=[];DB_KEYS.forEach(function(k){var arr=window[k],snap=SYNC.snap[k],vis={};if(!arr||!snap)return;
  arr.forEach(function(x){var key=dbKey(k,x);if(vis[key])return;vis[key]=1;var j=JSON.stringify(x);if(snap[key]!==j)ops.push({c:k,k:key,d:j,n:snap[key]===undefined?1:0})});
  Object.keys(snap).forEach(function(key){if(!vis[key])ops.push({c:k,k:key,d:null})})});return ops}
function api(met,url,body){return fetch(url,{method:met,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}).then(function(r){
  if(r.status===401){location.href="/login";throw {status:401}}
  return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){j.status=r.status;throw j}return j})})}
function dbSave(saindo){
  var ops=dbOps();SYNC.pend=ops.length;if(!ops.length){syncStatus();return}
  if(EU.papel==="leitura"){dbRevert();toast("Seu acesso é só para consulta: a alteração não foi salva.");return}
  if(saindo===true||(saindo&&saindo.type)){try{fetch("/api/sync",{method:"POST",keepalive:true,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({ops:ops})})}catch(e){}return}
  if(SYNC.enviando){SYNC.fila=true;return}
  SYNC.enviando=true;syncStatus();
  api("POST","/api/sync",{ops:ops}).then(function(r){
    var rej={};(r.rejeitados||[]).forEach(function(x){rej[x.c+"\u0001"+x.k]=x.motivo});
    ops.forEach(function(o){if(rej[o.c+"\u0001"+o.k])return;if(o.d===null)delete SYNC.snap[o.c][o.k];else SYNC.snap[o.c][o.k]=o.d});
    SYNC.erro=false;SYNC.ultimo=new Date();
    if(r.rejeitados&&r.rejeitados.length)dbConflitos(r.rejeitados);
  }).catch(function(e){SYNC.erro=e&&e.status!==undefined?(e.erro||"Erro ao salvar."):"Sem conexão";
    if(e&&e.status===403){dbRevert();toast(e.erro||"Você não tem permissão para esta alteração.")}
  }).then(function(){SYNC.enviando=false;SYNC.pend=dbOps().length;syncStatus();if(SYNC.fila){SYNC.fila=false;dbSave()}});
}
/* volta a tela para a última versão do banco */
function dbRevert(){DB_KEYS.forEach(function(k){var arr=window[k],snap=SYNC.snap[k];arr.length=0;Object.keys(snap).forEach(function(key){arr.push(JSON.parse(snap[key]))});if(k==="OSL")arr.sort(function(a,b){return a[0]<b[0]?1:-1})});SYNC.pend=0;dbRefresh(true)}
/* outra pessoa gravou o mesmo número de OS (ou o mesmo aviso) ao mesmo tempo: o registro daqui ganha outro número */
function dbConflitos(rs){
  var guard=rs.map(function(x){var arr=window[x.c],i=arr.findIndex(function(y){return dbKey(x.c,y)===x.k});return i<0?null:{c:x.c,m:x.motivo,item:arr.splice(i,1)[0]}}).filter(Boolean);
  dbPoll(true).then(function(){guard.forEach(function(g){if(g.m==="aviso")return;
    if(g.c==="OSL"){var antigo=g.item[0];g.item[0]=nextOS();OSL.unshift(g.item);toast("A "+antigo+" foi registrada por outra pessoa. A sua virou "+g.item[0]+".")}
    else if(g.c==="EVENTS"){g.item.id=g.item.id+"-"+Math.floor(Math.random()*1e4);EVENTS.push(g.item)}
    else{g.item.id=nid(window[g.c]);window[g.c].push(g.item)}});dbRefresh(true);dbSave()});
}
/* aplica o que veio do servidor sem perder o que ainda não foi enviado daqui */
function dbApply(mud){var mudou=false;Object.keys(mud).forEach(function(k){var arr=window[k],snap=SYNC.snap[k];if(!arr||!snap)return;
  mud[k].forEach(function(p){var key=p[0],j=p[1],i=-1;for(var n=0;n<arr.length;n++)if(dbKey(k,arr[n])===key){i=n;break}
    var local=i>=0?JSON.stringify(arr[i]):undefined,sujo=local!==snap[key];
    if(j===null){delete snap[key];if(i>=0&&!sujo){arr.splice(i,1);mudou=true}return}
    snap[key]=j;if(sujo&&local!==undefined)return;if(local===j)return;
    var o=JSON.parse(j);
    if(i<0){if(k==="OSL")arr.unshift(o);else arr.push(o)}
    else if(Array.isArray(o)&&Array.isArray(arr[i])){arr[i].length=0;Array.prototype.push.apply(arr[i],o)}
    else if(o&&typeof o==="object"&&arr[i]&&typeof arr[i]==="object"){Object.keys(arr[i]).forEach(function(f){delete arr[i][f]});for(var f in o)arr[i][f]=o[f]}
    else arr[i]=o;
    mudou=true})});
  if(mudou)dbRefresh();return mudou}
function dbPoll(forcar){
  if(!forcar&&(SYNC.enviando||dbOps().length)){dbSave();return Promise.resolve()}
  return api("GET","/api/mudancas?desde="+SYNC.ver).then(function(r){if(r.mud)dbApply(r.mud);SYNC.ver=r.ver;SYNC.erro=false;SYNC.ultimo=new Date();syncStatus()})
    .catch(function(e){if(e&&e.status!==401){SYNC.erro="Sem conexão";syncStatus()}});
}
/* redesenha a tela aberta, a não ser que a pessoa esteja digitando ou com uma janela aberta */
function dbRefresh(ja){
  var ae=document.activeElement,ocupado=$$(".modal").some(function(m){return !m.hidden})||(ae&&ae!==document.body&&(/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)||ae.isContentEditable)&&!ae.closest(".top"));
  if(ocupado&&!ja){SYNC.render=true;return}
  SYNC.render=false;var on=$(".view.on");if(!on)return;var v=on.id.slice(2),y=window.scrollY;
  try{if(VIEWS[v]&&VIEWS[v].show)VIEWS[v].show();refreshSide();window.scrollTo(0,y)}catch(e){location.reload()}
}
function syncStatus(){var el=document.getElementById("syncSt");if(!el)return;
  var hr=SYNC.ultimo?SYNC.ultimo.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  el.textContent=SYNC.erro?(SYNC.erro+(SYNC.pend?" · "+SYNC.pend+" alteração(ões) aguardando envio":"")+" · tentando de novo"):SYNC.enviando?"Salvando…":"Monte Fuji · banco compartilhado · atualizado às "+hr;
  el.classList.toggle("err",!!SYNC.erro)}
function dbDump(){var o={sistema:"Monte Fuji",versao:2,gerado:new Date().toISOString()};DB_KEYS.forEach(function(k){o[k]=window[k]});return o}
/* códigos únicos mesmo com várias pessoas cadastrando ao mesmo tempo */
function nid(a){var m=a.reduce(function(m,x){return Math.max(m,+x.id||0)},0);return Math.max(m+1,Date.now()*10+Math.floor(Math.random()*10))}

var CLIENTES=dbLoad("CLIENTES");
var FUNC=dbLoad("FUNC");
var OSL=dbLoad("OSL");      /* [número, data, cliente, serviço, técnico, valor, status] */
var EMAILS=dbLoad("EMAILS"); /* preenchido quando o Gmail for conectado */
var TAREFAS=dbLoad("TAREFAS");
var VK=dbLoad("VK");
var EVENTS=dbLoad("EVENTS");
var RECEBER=dbLoad("RECEBER");
var FATURAS=[];              /* Conta Azul, ainda não conectada */

var GAR_OPC=[[0,"Sem garantia"],[1,"1 mês"],[3,"3 meses"],[4,"4 meses"],[6,"6 meses"],[12,"12 meses"]];
function evOn(s){return EVENTS.filter(function(e){return e.date===s}).sort(function(a,b){return a.h-b.h})}

/* aniversários da equipe */
function bdaysOn(ds){var md=ds.slice(5);return FUNC.filter(function(f){return f.nasc&&f.nasc.slice(5)===md})}
function firstName(n){return n.split(" ")[0]}

/* histórico e garantias do cliente saem da agenda */
function cliEvs(c){return EVENTS.filter(function(e){return e.cli===c.nome})}
function histOf(c){return cliEvs(c).filter(function(e){return e.date<=TD}).sort(function(a,b){return a.date<b.date?1:-1}).map(function(e){return [e.date,(e.svs||[e.s])[0],(e.svs||[e.s]).join(", "),""]})}
function garOf(c){var seen={},out=[];cliEvs(c).filter(function(e){return e.gar>0}).forEach(function(e){var k=e.grp||e.id;if(seen[k])return;var g=e.grp?EVENTS.filter(function(x){return x.grp===e.grp}):[e];var last=g.map(function(x){return x.date}).sort().pop();if(last>TD)return;seen[k]=1;out.push([(e.svs||[e.s])[0],last,e.gar*30])});return out}

/* pastas do Drive conhecidas pelo sistema (as vinculadas aos clientes) */
var DRIVE_FOLDERS=CLIENTES.filter(function(c){return c.pasta}).map(function(c){return c.pasta.replace("Clientes / ","")});
function driveFiles(c){return osDoCliente(c).slice(0,6).map(function(o){return [o[0]+".pdf",o[1],"OS"]})}
function osDoCliente(c){return OSL.filter(function(o){return o[2]===c.nome}).sort(function(x,y){return x[1]<y[1]?1:-1})}
function nextOS(){var y=String(TODAY.getFullYear()),n=OSL.reduce(function(m,o){var p=String(o[0]).split("-");return p[1]===y?Math.max(m,+p[2]||0):m},0)+1;return "OS-"+y+"-"+String(n).padStart(4,"0")}
/* Conta Azul ainda não conectada: sem pagamentos */
function pagamentos(c){return []}

/* Receita Federal pela BrasilAPI (consulta real e gratuita) */
function consultaCNPJ(d,cb){
  fetch("https://brasilapi.com.br/api/cnpj/v1/"+d).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    function cap(s){return String(s||"").toLowerCase().replace(/(^|\s)\S/g,function(m){return m.toUpperCase()}).replace(/ (D[aeo]s?|E) /g,function(m){return m.toLowerCase()})}
    var tel=String(j.ddd_telefone_1||"").replace(/\D/g,""),end=[cap(j.descricao_tipo_de_logradouro?j.descricao_tipo_de_logradouro+" "+j.logradouro:j.logradouro),j.numero].filter(Boolean).join(", ")+(j.complemento?" "+cap(j.complemento):"")+" · "+cap(j.bairro)+", "+cap(j.municipio)+"/"+(j.uf||"");
    cb(null,{razao:j.razao_social||"",fantasia:cap(j.nome_fantasia||j.razao_social||""),end:end,tel:tel.length>=10?"("+tel.slice(0,2)+") "+tel.slice(2,-4)+"-"+tel.slice(-4):"",email:String(j.email||"").toLowerCase(),perfil:/condom/i.test(j.razao_social||"")?"Condomínio":"Comércio",situacao:cap(j.descricao_situacao_cadastral||"—"),abertura:j.data_inicio_atividade||"",cnae:(j.cnae_fiscal?String(j.cnae_fiscal):"")+(j.cnae_fiscal_descricao?" · "+j.cnae_fiscal_descricao:"")});
  }).catch(function(e){cb(e)});
}
function fmtCNPJ(d){return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5")}

function recSt(r){if(r.pago)return["ok","Recebido"];if(!r.nf)return["ne","NF a emitir"];if(r.venc<TD)return["er","Vencido"];if(!r.cob)return["al","Cobrança pendente"];return["in","A vencer"]}

/* Vencimento de garantia: um item por agendamento com garantia, na data em que ela vence */
function vencList(){var g={};EVENTS.forEach(function(e){if(!e.gar)return;var k=e.grp||e.id;if(!g[k]||e.date>g[k].last)g[k]={k:k,cli:e.cli,svs:e.svs||[e.s],last:e.date,gar:e.gar,ev:e.id}});
  return Object.keys(g).map(function(k){var x=g[k];x.venc=addMonths(x.last,x.gar);
    x.renov=EVENTS.some(function(e){return e.cli===x.cli&&(e.grp||e.id)!==k&&e.date>x.last});return x}).filter(function(x){return !x.renov})}
function vencOn(k){return vencList().filter(function(x){return x.venc===k})}
/* Vencimentos do A receber, em verde na agenda */
function recOn(k){return RECEBER.filter(function(r){return r.venc===k})}
function recTit(r){return (r.pago?"Recebido: ":"A receber: ")+r.nome+" · "+brl(r.valor)}
function vencMsg(x){var c=CLIENTES.find(function(y){return y.nome===x.cli}),nm=c&&c.contato?firstName(c.contato):x.cli;
  return "Olá, "+nm+"! Tudo bem? Aqui é da Monte Fuji. O serviço de "+x.svs.join(", ").toLowerCase()+" realizado em "+dmy(x.last)+" está com a garantia vencendo em "+dmy(x.venc)+". Para manter o local protegido, precisamos agendar uma nova aplicação. Qual a melhor data para vocês?"}
/* Uma semana antes do vencimento cria a anotação de contato (uma vez só, mesmo se apagada) */
function syncVenc(){var n=0;vencList().forEach(function(x){if(VK.indexOf(x.k)>=0)return;var aviso=ymd(addDays(new Date(x.venc+"T12:00"),-7));
  if(TD<aviso||TD>ymd(addDays(new Date(x.venc+"T12:00"),30)))return;
  TAREFAS.push({id:nid(TAREFAS),col:"todo",t:"Garantia vencendo: "+x.cli,d:x.svs.join(", ")+" realizado em "+dmy(x.last)+". Vence em "+dmy(x.venc)+". Entrar em contato e agendar nova aplicação.",due:x.venc,who:"MF",done:false,vk:x.k,msg:vencMsg(x)});VK.push(x.k);n++});
  if(n)dbSave();return n}

function bindPick(inp,onPick){
  var ul=inp.nextElementSibling,act=-1,items=[];

    var q=norm(inp.value.trim());
    var qd=digits(q);items=CLIENTES.filter(function(c){return !q||norm(c.nome+" "+c.razao+" "+c.doc).indexOf(q)>=0||(qd.length>=4&&digits(c.doc).indexOf(qd)>=0)}).slice(0,6).map(function(c){return {c:c}});

    ul.hidden=false;inp.setAttribute("aria-expanded","true");
  }
  inp.addEventListener("input",function(){act=-1;draw()});
  inp.addEventListener("focus",draw);
  inp.addEventListener("blur",function(){setTimeout(close,120)});
  inp.addEventListener("keydown",function(e){
    if(ul.hidden&&e.key==="ArrowDown"){draw();return}
    if(e.key==="ArrowDown"){e.preventDefault();act=Math.min(items.length-1,act+1);draw()}
    else if(e.key==="ArrowUp"){e.preventDefault();act=Math.max(0,act-1);draw()}
    else if(e.key==="Enter"&&!ul.hidden&&act>=0){e.preventDefault();choose(act)}
    else if(e.key==="Escape"){close()}
  });

}

/* ===== importar clientes do Conta Azul (planilha exportada: .xlsx, .xls ou .csv) ===== */
var IMP_CAMPOS=[
  ["nome","Nome do cliente",["nome","nome do cliente","cliente","nome / razao social","nome/razao social","nome ou razao social"]],
  ["fantasia","Nome fantasia",["nome fantasia","fantasia"]],
  ["razao","Razão social",["razao social","razao"]],
  ["doc","CNPJ / CPF",["cpf/cnpj","cnpj/cpf","cpf / cnpj","cnpj / cpf","cnpj","documento","cpf ou cnpj","cnpj ou cpf"]],
  ["cpf","CPF (coluna separada)",["cpf"]],
  ["tipo","Tipo de pessoa",["tipo de pessoa","tipo pessoa","pessoa","tipo"]],
  ["email","E-mail",["e-mail","email","e-mail principal","email principal","emails","e-mails"]],
  ["email2","E-mail do contato",["e-mail contato","email contato","e-mail do contato","email do contato"]]
];
function impKey(s){return norm(String(s||"")).replace(/[º°]/g,"o").replace(/[*:]/g,"").replace(/\s+/g," ").trim()}
/* acha a linha de cabeçalho e liga cada campo a uma coluna */
function impDetect(rows){
  var best={row:0,map:{},n:-1};
  rows.slice(0,15).forEach(function(r,ri){
    var hs=r.map(impKey),map={},used={},n=0;
    function take(f,j){if(j>=0){map[f[0]]=j;used[j]=1;n++}}
    /* primeiro os nomes exatos, depois os parecidos */
    IMP_CAMPOS.forEach(function(f){take(f,hs.findIndex(function(h,k){return !used[k]&&h&&f[2].indexOf(h)>=0}))});
    IMP_CAMPOS.forEach(function(f){if(map[f[0]]!==undefined||["num","tipo","uf"].indexOf(f[0])>=0)return;take(f,hs.findIndex(function(h,k){return !used[k]&&h&&f[2].some(function(s){return s.length>3&&h.indexOf(s)>=0})}))});
    if(n>best.n)best={row:ri,map:map,n:n};
  });
  return best;
}
function fmtCPF(d){return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4")}
function impDoc(v,tipo){
  var d=digits(v),t=norm(tipo||"");if(!d)return "";
  /* planilhas do Excel costumam perder os zeros à esquerda */
  if(d.length>11&&d.length<14)d=d.padStart(14,"0");
  else if(d.length<11&&d.length>=9)d=/jur/.test(t)?d.padStart(14,"0"):d.padStart(11,"0");
  return d.length===14?fmtCNPJ(d):d.length===11?fmtCPF(d):String(v).trim();
}
function impPerfil(o){
  var t=norm(o.nome+" "+o.razao);
  if(/condom|edif|residencial|conjunto habitacional/.test(t))return "Condomínio";
  if(/constru|incorpora|engenharia/.test(t))return "Construtora";
  if(/industria/.test(t))return "Indústria";
  if(digits(o.doc).length===11||/fis/.test(norm(o.tipo||"")))return "Residência";
  return "Comércio";
}
/* transforma as linhas da planilha em clientes do sistema */
function impBuild(rows,hdr,map){
  function g(r,k){var j=map[k];return j===undefined||j===""||j===null?"":String(r[j]==null?"":r[j]).trim()}
  var out=[];
  rows.slice(hdr+1).forEach(function(r){
    if(!r||!r.some(function(x){return String(x==null?"":x).trim()}))return;
    var nome=g(r,"fantasia")||g(r,"nome")||g(r,"razao"),tipo=g(r,"tipo");
    /* só nome, CNPJ/CPF e e-mails: telefones, contato e endereço ficam de fora */
    var ems=(g(r,"email")+","+g(r,"email2")).toLowerCase().split(/[;,\s]+/).filter(function(x,i,l){return x.indexOf("@")>0&&l.indexOf(x)===i});
    var o={nome:nome,razao:g(r,"razao")||g(r,"nome")||nome,doc:impDoc(g(r,"doc")||g(r,"cpf"),g(r,"doc")?tipo:"Física"),tipo:tipo,email:ems.join(", ")};
    o.perfil=impPerfil(o);out.push(o);
  });
  return out;
}
/* separa novos, já cadastrados (mesmo nome) e linhas sem nome;
   o mesmo CNPJ com outro nome conta como outra unidade do cliente */
function impPlan(list){
  var byNome={},seen={},plan={novos:[],existentes:[],semNome:0,repetidos:0};
  CLIENTES.forEach(function(c){byNome[norm(c.nome)]=c});

/* lê CSV (separador ; ou , e acentos em UTF-8 ou Windows-1252) */
function impCSV(buf){
  var txt=new TextDecoder("utf-8").decode(buf);if(txt.indexOf("�")>=0)txt=new TextDecoder("windows-1252").decode(buf);
  txt=txt.replace(/^﻿/,"");
  var first=txt.split(/\r?\n/)[0]||"",sep=(first.split(";").length>=first.split(",").length)?";":(first.split("\t").length>first.split(",").length?"\t":",");
  var rows=[],row=[],cell="",q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

        +'<div class="ft"><span class="duew"><button class="due'+(l?' late':'')+(t.due?'':' none')+'" type="button" data-due>'+dueLbl(t)+'</button><input type="date" tabindex="-1" aria-label="Data da nota" value="'+(t.due||"")+'"></span>'+(t.chk?'<span class="chk">☑ '+t.chk+'</span>':'')+'<span class="sp"></span><span class="who">'+t.who+'</span></div></div>'}).join("")
      +'<button class="add" type="button" data-add="'+c[0]+'">+ Adicionar cartão</button></div>'}).join("")+'</div>';
  }

  var dragId=null;

  v.addEventListener("dragend",function(){dragId=null;$$(".col",v).forEach(function(c){c.classList.remove("over")});$$(".tk",v).forEach(function(c){c.classList.remove("drag")})});
  v.addEventListener("dragover",function(e){var c=e.target.closest(".col");if(!c||dragId===null)return;e.preventDefault();$$(".col",v).forEach(function(x){x.classList.toggle("over",x===c)})});

  v.addEventListener("change",function(e){

    var f=e.target.closest(".filt button");if(f){st.f=f.textContent;render()}
  });
  VIEWS.notas.show=function(){syncVenc();render()};
  v.addEventListener("dblclick",function(e){var b=e.target.closest(".tt b");if(b){b.contentEditable="true";b.focus()}});
  v.addEventListener("focusout",function(e){var b=e.target.closest(".tt b");if(b&&b.isContentEditable){b.contentEditable="false";var t=tk(b);t.t=b.textContent.trim()||"Sem título"}});

/* ===== ORDENS DE SERVIÇO ===== */
/* Google Drive: estado da ligação e as pastas reais dos clientes (o servidor lê do Drive) */
var GDRIVE={st:null,pastas:null,ps:null,pp:null};
function gStatus(forcar){if(forcar||!GDRIVE.ps)GDRIVE.ps=api("GET","/api/google").then(function(r){GDRIVE.st=r;return r}).catch(function(){GDRIVE.ps=null;return GDRIVE.st||{configurado:false,conectado:false}});return GDRIVE.ps}
function gPastas(forcar){if(forcar||!GDRIVE.pp)GDRIVE.pp=api("GET","/api/drive/pastas"+(forcar?"?atualizar=1":"")).then(function(r){GDRIVE.pastas=r.pastas||[];return GDRIVE.pastas}).catch(function(e){GDRIVE.pp=null;throw e});return GDRIVE.pp}
function gLigado(){return !!(GDRIVE.st&&GDRIVE.st.conectado)}
function pastaUrl(id){return "https://drive.google.com/drive/folders/"+encodeURIComponent(id)}
function pastaNome(f){return f.grupo+" / "+f.nome}
/* nome da pasta x nome do cliente: "Cond. Ed. Paesaggio Villa Lobos" casa com "Condomínio Edifício Paesaggio Villa Lobos" */
var G_ABREV={cond:"condominio",ed:"edificio",edif:"edificio",res:"residencial",resid:"residencial",ap:"apartamento",apto:"apartamento",av:"avenida"};
var G_FORA={de:1,da:1,"do":1,das:1,dos:1,e:1,ltda:1,me:1,sa:1,eireli:1};
function gTok(s){return norm(String(s||"")).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(function(w){return G_ABREV[w]||w}).filter(function(w){return !G_FORA[w]})}
function gNota(c,f){var ft=gTok(f.nome),ct={};if(!ft.length)return 0;gTok(c.nome+" "+(c.razao||"")).forEach(function(w){ct[w]=1});return ft.filter(function(w){return ct[w]}).length/ft.length}
/* pasta sugerida: só quando uma única pasta tem todas as palavras no nome do cliente */
function gSugestao(c){if(!GDRIVE.pastas||!c)return null;var l=GDRIVE.pastas.filter(function(f){return gNota(c,f)===1});return l.length===1?l[0]:null}
/* coluna "Arquivo" das listas de OS */
function osArquivo(o){var x=o[7];if(x&&x.doc)return '<a class="ghost" href="'+esc(x.doc.url)+'" target="_blank" rel="noopener">'+ic("drive",12)+' Abrir</a>';
  if(gLigado()&&EU.papel!=="leitura")return '<button class="ghost" type="button" data-osdrive="'+esc(o[0])+'">'+ic("drive",12)+' Salvar no Drive</button>';return '<span class="mut">—</span>'}
/* salva no Drive uma OS já registrada (a pasta vem do cliente ou é escolhida agora) */
function osSalvarDrive(num,pronto){var o=OSL.find(function(x){return x[0]===num});if(!o)return;
  var c=CLIENTES.find(function(x){return x.nome===o[2]}),pid=(o[7]&&o[7].pasta&&o[7].pasta.id)||(c&&c.pastaId)||"";
  function vai(id){toast("Salvando "+num+" no Google Drive…");api("POST","/api/os/drive",{numero:num,pastaId:id}).then(function(r){return dbPoll(true).then(function(){toast(num+" salva na pasta do cliente.");if(pronto)pronto()})}).catch(function(e){toast(e.erro||"Não consegui salvar no Google Drive.")})}
  if(pid){vai(pid);return}
  openDriveModal("",function(f){if(c&&!c.pastaId){c.pastaId=f.id;c.pasta=pastaNome(f);dbSave()}vai(f.id)},c)}
var _drvCb=null,_drvCli=null;
function openDriveModal(q,cb,cliAtual){
  var m=$("#drvModal");
  if(!m){
    m=document.createElement("div");m.className="modal";m.id="drvModal";m.hidden=true;
    m.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="dvT"><div class="ch" style="margin:0"><h3 id="dvT">Escolher pasta no Google Drive</h3><span class="pill go">Monte Fuji Dedetizadora e Desentupidora</span></div>'
    +'<div class="search">'+ic("search",14)+'<input id="dvQ" placeholder="Nome do cliente ou da pasta" aria-label="Buscar pasta"></div><ul class="dvl" id="dvL"></ul>'
    +'<div class="acts"><button class="ghost" type="button" data-dvr>Atualizar lista</button><button class="ghost" type="button" data-dvx>Fechar</button></div></div>';
    document.body.appendChild(m);
    m.addEventListener("click",function(e){
      if(e.target===m||e.target.closest("[data-dvx]")){m.hidden=true;return}
      if(e.target.closest("[data-dvr]")){$("#dvL").innerHTML='<li class="mut">Atualizando…</li>';gPastas(true).then(draw,erro);return}
      var li=e.target.closest("[data-fold]");if(li){var f=(GDRIVE.pastas||[]).find(function(x){return x.id===li.dataset.fold});if(f){m.hidden=true;_drvCb&&_drvCb(f)}}
    });
    m.addEventListener("keydown",function(e){var li=e.target.closest("[data-fold]");if(li&&e.key==="Enter")li.click()});
    m.addEventListener("input",draw);
  }
  function erro(e){$("#dvL").innerHTML='<li class="mut">'+esc(e&&e.erro||"Não consegui abrir o Google Drive.")+'</li>'}
  function draw(){
    if(!GDRIVE.pastas){$("#dvL").innerHTML='<li class="mut">Carregando as pastas do Google Drive…</li>';return}
    var qq=norm($("#dvQ").value.trim()),L=GDRIVE.pastas.filter(function(f){return !qq||norm(f.nome+" "+f.grupo).indexOf(qq)>=0});
    if(_drvCli&&!qq)L=L.map(function(f){return [f,gNota(_drvCli,f)]}).sort(function(a,b){return b[1]-a[1]}).map(function(x){return x[0]});
    $("#dvL").innerHTML=L.length?L.slice(0,150).map(function(f){var c=CLIENTES.find(function(x){return x.pastaId===f.id});return '<li data-fold="'+esc(f.id)+'" tabindex="0">'+ic("drive",16)+'<span class="grow"><b>'+esc(f.nome)+'</b><small>'+esc(f.grupo)+'</small></span>'+(c?'<span class="pill ok">'+esc(c.nome)+'</span>':'')+'</li>'}).join(""):'<li class="mut">Nenhuma pasta encontrada.</li>'}
  _drvCb=cb;_drvCli=cliAtual||null;$("#dvQ").value=q||"";draw();m.hidden=false;setTimeout(function(){$("#dvQ").focus()},30);
  gStatus().then(function(st){if(!st.conectado){erro({erro:"O Google Drive não está conectado. O administrador conecta em Configurações › Integrações."});return}gPastas().then(draw,erro)});
}

  var grp=e.grp?EVENTS.filter(function(x){return x.grp===e.grp}):[e];if(!grp.length)grp=[e];
  $("#cmDias").innerHTML=grp.sort(function(a,b){return a.date<b.date?-1:1}).map(function(x){return diaRow(x.date)}).join("");$("#cmHora").value=String(grp[0].h);
  $("#cmObs").value="";m.hidden=false;prev();
}


/* ===== CONTA DO USUÁRIO, USUÁRIOS, MIGRAÇÃO E ATUALIZAÇÃO AUTOMÁTICA ===== */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var PAPEL_TXT={admin:"Administrador",colaborador:"Colaborador",leitura:"Somente consulta"};
function mfModal(id,html){var m=$("#"+id);if(!m){m=document.createElement("div");m.className="modal";m.id=id;document.body.appendChild(m);
  m.addEventListener("click",function(e){if(e.target===m||e.target.closest("[data-mx]"))m.hidden=true})}
  m.innerHTML='<div class="box" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;return m}

/* menu lateral: "Minha conta" e "Sair" (o menu é redesenhado, então o clique é delegado) */
function sair(){dbSave();api("POST","/api/logout",{}).catch(function(){}).then(function(){location.href="/login"})}
document.addEventListener("click",function(e){var a=e.target.closest("#sideMe,#sideSair");if(!a)return;e.preventDefault();$("#app").classList.remove("nav-open");if(a.id==="sideSair")sair();else contaModal()});
function contaModal(){
  var m=mfModal("contaModal",'<h3>Minha conta</h3><div class="kv2 one"><div><small>Nome</small><span>'+esc(EU.nome)+'</span></div><div><small>Acesso</small><span>'+esc(EU.email)+'</span></div><div><small>Perfil</small><span>'+(PAPEL_TXT[EU.papel]||EU.papel)+'</span></div></div>'
    +'<div class="form"><div class="fld full"><label for="pwA">Senha atual</label><input id="pwA" type="password" autocomplete="current-password"></div><div class="fld"><label for="pwN">Nova senha</label><input id="pwN" type="password" autocomplete="new-password" placeholder="Pelo menos 8 caracteres"></div><div class="fld"><label for="pwC">Repita a nova senha</label><input id="pwC" type="password" autocomplete="new-password"></div></div>'
    +'<div class="acts" style="flex-wrap:wrap"><button class="ghost" type="button" id="sairBt">Sair do sistema</button><span style="flex:1"></span><button class="ghost" type="button" data-mx>Fechar</button><button class="cta" type="button" id="pwBt">Trocar senha</button></div>');
  $("#sairBt",m).onclick=sair;
  $("#pwBt",m).onclick=function(){var a=$("#pwA").value,n=$("#pwN").value;if(n!==$("#pwC").value){toast("A confirmação não confere com a nova senha.");return}
    api("POST","/api/senha",{atual:a,nova:n}).then(function(){m.hidden=true;toast("Senha alterada. Os outros aparelhos com a sua conta foram desconectados.")}).catch(function(e){toast(e.erro||"Não foi possível trocar a senha.")})};
}

/* Configurações › Usuários (o servidor só deixa o administrador ver e mudar os outros) */
function usuariosCard(alvo){
  alvo.innerHTML='<div class="ch"><h4>Usuários</h4>'+(EU.papel==="admin"?'<button class="cta" type="button" id="uNovo">'+ic("plus",13)+'Novo usuário</button>':'')+'</div><ul class="ls" id="uLs"><li class="mut">Carregando…</li></ul>'
    +'<p class="sub">'+(EU.papel==="admin"?'Cada colaborador entra com o próprio e-mail e senha. Ao criar ou redefinir, o sistema mostra uma senha temporária uma única vez; no primeiro acesso a pessoa define a dela.':'Para incluir colegas ou mudar permissões, fale com o administrador.')+'</p>';
  function lista(){api("GET","/api/usuarios").then(function(r){$("#uLs",alvo).innerHTML=r.usuarios.map(function(u){
      return '<li'+(EU.papel==="admin"?' class="lk" data-uid="'+u.id+'"':'')+'><span class="av" style="background:var(--trigo);color:var(--fluxo)">'+esc(u.iniciais)+'</span><span class="grow"><b>'+esc(u.nome)+(u.id===EU.id?' (você)':'')+'</b><small>'+esc(u.email)+' · '+(PAPEL_TXT[u.papel]||u.papel)+(u.ultimo_acesso?' · último acesso '+new Date(u.ultimo_acesso.replace(" ","T")+"Z").toLocaleDateString("pt-BR"):'')+'</small></span>'
        +(u.ativo===0?'<span class="pill ne">Desativado</span>':u.trocar_senha?'<span class="pill al">Primeiro acesso pendente</span>':'<span class="pill ok">Ativo</span>')+'</li>'}).join("");
      usuariosCard.dados=r.usuarios}).catch(function(e){$("#uLs",alvo).innerHTML='<li class="mut">'+esc(e.erro||"Não foi possível carregar os usuários.")+'</li>'})}
  function senhaMsg(nome,email,s){mfModal("uSenha",'<h3>Senha temporária de '+esc(nome)+'</h3><p class="txt">Passe para a pessoa por um canal seguro (WhatsApp ou pessoalmente). Ela aparece só agora; no primeiro acesso o sistema pede uma senha nova.</p>'
    +'<div class="kv2 one"><div><small>Endereço</small><span>'+esc(location.origin)+'</span></div><div><small>E-mail ou usuário</small><span>'+esc(email)+'</span></div><div><small>Senha temporária</small><span style="font-family:monospace;font-size:15px">'+esc(s)+'</span></div></div>'
    +'<div class="acts"><button class="ghost" type="button" id="uCp">'+ic("doc",12)+' Copiar instruções</button><button class="cta" type="button" data-mx>Pronto</button></div>');
    $("#uCp").onclick=function(){copyText("Acesso ao sistema Monte Fuji\nEndereço: "+location.origin+"\nLogin: "+email+"\nSenha temporária: "+s+"\nNo primeiro acesso, defina a sua senha.",function(ok){toast(ok?"Instruções copiadas.":"Não consegui copiar.")})}}
  function form(u){var novo=!u;
    var m=mfModal("uForm",'<h3>'+(novo?'Novo usuário':'Editar '+esc(u.nome))+'</h3><div class="form"><div class="fld full"><label for="uNome">Nome</label><input id="uNome" value="'+esc(novo?"":u.nome)+'"></div>'
      +'<div class="fld full"><label for="uEmail">E-mail ou usuário de acesso</label><input id="uEmail" autocapitalize="none" spellcheck="false" value="'+esc(novo?"":u.email)+'"'+(novo?'':' disabled')+'></div>'
      +'<div class="fld full"><label for="uPapel">Perfil</label><select id="uPapel">'+["colaborador","admin","leitura"].map(function(p){return '<option value="'+p+'"'+(!novo&&u.papel===p?' selected':'')+'>'+PAPEL_TXT[p]+'</option>'}).join("")+'</select></div></div>'
      +'<p class="sub">Colaborador: usa todo o sistema. Administrador: também cria usuários, baixa e restaura backups. Somente consulta: vê tudo, não altera nada.</p>'
      +'<div class="acts" style="flex-wrap:wrap">'+(novo?'':'<button class="ghost" type="button" id="uReset">Redefinir senha</button><button class="ghost" type="button" id="uAtivo">'+(u.ativo?'Desativar acesso':'Reativar acesso')+'</button>')+'<span style="flex:1"></span><button class="ghost" type="button" data-mx>Cancelar</button><button class="cta" type="button" id="uSalvar">Salvar</button></div>');
    function enviar(extra,msg){var b={nome:$("#uNome").value.trim(),papel:$("#uPapel").value};for(var k in extra)b[k]=extra[k];
      (novo?api("POST","/api/usuarios",{nome:b.nome,email:$("#uEmail").value.trim(),papel:b.papel}):api("POST","/api/usuarios/"+u.id,b)).then(function(r){m.hidden=true;lista();
        if(r.senha_temporaria)senhaMsg(b.nome,novo?$("#uEmail").value.trim():u.email,r.senha_temporaria);else toast(msg||"Usuário salvo.")}).catch(function(e){toast(e.erro||"Não foi possível salvar.")})}
    $("#uSalvar",m).onclick=function(){enviar({})};
    if(!novo){$("#uReset",m).onclick=function(){enviar({redefinir_senha:true})};$("#uAtivo",m).onclick=function(){enviar({ativo:!u.ativo},u.ativo?"Acesso desativado. A pessoa foi desconectada.":"Acesso reativado.")}}
    setTimeout(function(){$("#uNome").focus()},30)}
  alvo.onclick=function(e){if(e.target.closest("#uNovo")){form(null);return}var li=e.target.closest("[data-uid]");if(li){form((usuariosCard.dados||[]).find(function(x){return x.id===+li.dataset.uid}))}};
  lista();
}

/* Configurações › Banco de dados e backup */
function bancoCard(alvo){
  var tot=CLIENTES.length+FUNC.length+OSL.length+TAREFAS.length+EVENTS.length+RECEBER.length,adm=EU.papel==="admin";
  alvo.innerHTML='<div class="ch"><h4>Banco de dados e backup</h4><span class="pill ok">Compartilhado</span></div>'
    +'<p class="txt">Tudo o que a equipe cadastra fica no banco da Monte Fuji na Cloudflare (D1). As telas se atualizam sozinhas em poucos segundos. Uma cópia completa é guardada todo dia de madrugada'+(adm?', e você pode baixar outra quando quiser.':'.')+'</p>'
    +'<div class="kv2"><div><small>Registros</small><span>'+tot+'</span></div><div><small>Última sincronização</small><span id="bkSync">'+(SYNC.ultimo?SYNC.ultimo.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"—")+'</span></div></div>'
    +(adm?'<div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="cta" type="button" id="bkDown">'+ic("down",13)+' Baixar backup agora</button><button class="ghost" type="button" id="bkUp">'+ic("up",13)+' Restaurar de um arquivo</button><button class="ghost" type="button" id="bkList">Backups automáticos</button>'
      +(localTem()?'<button class="ghost" type="button" id="bkLocal">Importar dados deste navegador</button>':'')+'<input type="file" id="bkFile" accept=".json,application/json" hidden></div>'
      +'<p class="sub">Restaurar não apaga nada: só acrescenta o que estiver no arquivo e ainda não existir no banco.</p>':'');
  if(!adm)return;
  alvo.onclick=function(e){
    if(e.target.closest("#bkDown")){dbSave();fetch("/api/backup",{credentials:"same-origin"}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){saveFile("backup-monte-fuji-"+TD+".json",b,function(ok){if(ok)toast("Backup baixado.")})}).catch(function(){toast("Não foi possível gerar o backup.")});return}
    if(e.target.closest("#bkUp")){$("#bkFile").click();return}
    if(e.target.closest("#bkLocal")){migrarLocal(true);return}
    if(e.target.closest("#bkList")){api("GET","/api/backups").then(function(r){mfModal("bkMod",'<h3>Backups automáticos</h3><p class="txt">Uma cópia por dia, guardada por 60 dias, além de uma cópia feita antes de cada importação.</p><ul class="ls">'
      +(r.backups.length?r.backups.map(function(n){return '<li><span class="grow"><b>'+esc(n)+'</b></span><a class="ghost" href="/api/backups/'+encodeURIComponent(n)+'" download>'+ic("down",12)+' Baixar</a></li>'}).join(""):'<li class="mut">O primeiro backup automático sai na próxima madrugada.</li>')+'</ul><div class="acts"><button class="cta" type="button" data-mx>Fechar</button></div>')}).catch(function(e){toast(e.erro||"Não foi possível listar os backups.")});return}
  };
  alvo.onchange=function(e){if(e.target.id!=="bkFile"||!e.target.files[0])return;var rd=new FileReader();
    rd.onload=function(){var o;try{o=JSON.parse(rd.result);if(o.sistema!=="Monte Fuji")throw 0}catch(x){toast("Este arquivo não é um backup do sistema Monte Fuji.");return}importarModal(o,"arquivo")};
    rd.readAsText(e.target.files[0]);e.target.value=""};
}

/* ===== migração: dados que a versão anterior guardava neste navegador ===== */
function localDados(){var o={},n=0;DB_KEYS.forEach(function(k){try{var v=JSON.parse(localStorage.getItem("mfs-"+k));if(Array.isArray(v)&&v.length){o[k]=v;n+=v.length}}catch(e){}});return n?o:null}
function localTem(){return !!localDados()}
function migrarLocal(manual){if(EU.papel!=="admin")return;var o=localDados();if(!o){if(manual)toast("Não há dados da versão anterior neste navegador.");return}
  var feito=null;try{feito=localStorage.getItem("mfs-migrado")}catch(e){}if(feito&&!manual)return;
  importarModal(o,"navegador")}
var IMP_NOME={CLIENTES:"Clientes",FUNC:"Funcionários",OSL:"Ordens de serviço",TAREFAS:"Anotações",EVENTS:"Agendamentos",RECEBER:"A receber",EMAILS:"E-mails",VK:"Avisos de garantia"};
/* registros com cara de teste ou exemplo ficam de fora, a não ser que sejam marcados */
function parecemTeste(k,x){var t=k==="OSL"?x.join(" "):k==="VK"?String(x):[x.nome,x.razao,x.t,x.d,x.cli,x.obs,x.email].join(" ");return /\b(teste|testes|test|exemplo|demo|demonstra[cç][aã]o|fict[ií]cio|fulano|ciclano)\b/i.test(norm(t))}
function rotulo(k,x){if(k==="OSL")return x[0]+" · "+x[2];if(k==="VK")return String(x);if(k==="EVENTS")return dmy(x.date)+" · "+x.cli;if(k==="TAREFAS")return x.t;return x.nome||x.t||String(x.id)}
function importarModal(o,origem){
  var testes=[];DB_KEYS.forEach(function(k){(o[k]||[]).forEach(function(x,i){if(parecemTeste(k,x))testes.push({k:k,i:i,x:x})})});
  var m=mfModal("impLocal",'<h3>'+(origem==="navegador"?'Dados da versão anterior neste navegador':'Restaurar backup')+'</h3>'
    +'<p class="txt">'+(origem==="navegador"?'Antes do banco compartilhado, o sistema guardava os cadastros no navegador. Encontrei estes registros aqui. Confira e leve para o banco, para toda a equipe ver.':'Confira o que entra no banco. Nada existente é apagado ou alterado.')+' Registros iguais aos que já estão no banco são ignorados, então não há duplicação.</p>'
    +'<div id="impRes"><p class="mut">Conferindo com o banco…</p></div>'
    +(testes.length?'<div><b style="font-size:12.5px">Parecem testes ou exemplos ('+testes.length+')</b><p class="sub">Ficam de fora. Marque os que forem dados reais.</p><ul class="ls" style="max-height:180px;overflow:auto">'+testes.map(function(t,j){return '<li><label style="display:flex;gap:8px;align-items:center;width:100%"><input type="checkbox" data-ti="'+j+'"><span class="grow">'+esc(rotulo(t.k,t.x))+'<small> · '+IMP_NOME[t.k]+'</small></span></label></li>'}).join("")+'</ul></div>':'')
    +'<div class="acts"><button class="ghost" type="button" id="impDepois">'+(origem==="navegador"?'Agora não':'Cancelar')+'</button><button class="cta" type="button" id="impOk" disabled>Importar</button></div>');
  function escolhidos(){var out={},fora={};testes.forEach(function(t,j){var c=$('[data-ti="'+j+'"]',m);if(!c||!c.checked)fora[t.k+"#"+t.i]=1});
    DB_KEYS.forEach(function(k){if(o[k])out[k]=o[k].filter(function(x,i){return !fora[k+"#"+i]})});return out}
  function simular(){api("POST","/api/importar",{dados:escolhidos(),simular:true}).then(function(r){var novos=0;
      $("#impRes",m).innerHTML='<div class="scroll-x"><table class="tb"><thead><tr><th>Módulo</th><th class="r">Neste '+(origem==="navegador"?'navegador':'arquivo')+'</th><th class="r">Já no banco</th><th class="r">Vão entrar</th></tr></thead><tbody>'
        +Object.keys(r.resumo).map(function(k){var s=r.resumo[k];novos+=s.novos;return '<tr><td>'+IMP_NOME[k]+'</td><td class="r num">'+s.recebidos+'</td><td class="r num">'+s.duplicados+'</td><td class="r num"><b>'+s.novos+'</b></td></tr>'}).join("")+'</tbody></table></div>';
      var b=$("#impOk",m);b.disabled=!novos;b.textContent=novos?"Importar "+novos+" registro"+(novos>1?"s":""):"Nada novo para importar"})
    .catch(function(e){$("#impRes",m).innerHTML='<p class="mut">'+esc(e.erro||"Não foi possível conferir agora.")+'</p>'})}
  m.onchange=function(e){if(e.target.dataset.ti!==undefined)simular()};
  $("#impDepois",m).onclick=function(){m.hidden=true;if(origem==="navegador")toast("Tudo bem. Dá para importar depois em Configurações › Banco de dados.")};
  $("#impOk",m).onclick=function(){var b=this;b.disabled=true;b.textContent="Importando…";dbSave();
    api("POST","/api/importar",{dados:escolhidos()}).then(function(r){var n=0;Object.keys(r.resumo).forEach(function(k){n+=r.resumo[k].novos});
      if(origem==="navegador")try{localStorage.setItem("mfs-migrado",new Date().toISOString())}catch(e){}
      m.hidden=true;toast(n+" registro"+(n===1?"":"s")+" importado"+(n===1?"":"s")+" para o banco compartilhado.");dbPoll(true)})
    .catch(function(e){b.disabled=false;b.textContent="Tentar de novo";toast(e.erro||"A importação não foi concluída. Nada foi alterado.")})};
  simular();
}

/* ===== atualização automática: a cada 5 s com a tela em uso, 15 s parada, pausa com a aba escondida ===== */
var POLL={t:null,uso:Date.now()};
["click","keydown","mousemove","touchstart","scroll"].forEach(function(ev){document.addEventListener(ev,function(){POLL.uso=Date.now()},{passive:true})});
function pollLoop(){clearTimeout(POLL.t);if(document.hidden)return;
  dbPoll().then(function(){if(SYNC.render)dbRefresh();POLL.t=setTimeout(pollLoop,Date.now()-POLL.uso<120000?5000:15000)})}
document.addEventListener("visibilitychange",function(){if(!document.hidden){POLL.uso=Date.now();pollLoop()}});
document.addEventListener("focusout",function(){if(SYNC.render)setTimeout(function(){if(SYNC.render)dbRefresh()},300)});
window.addEventListener("online",function(){dbSave();pollLoop()});
syncStatus();POLL.t=setTimeout(pollLoop,5000);
setTimeout(function(){migrarLocal(false)},800);

</script>
